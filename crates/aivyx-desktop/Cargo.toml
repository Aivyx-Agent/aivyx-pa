[package]
name = "aivyx-desktop"
description = "Native desktop shell for Aivyx — a system-webview window that hosts the local Studio (served by the daemon at 127.0.0.1:7843) plus daemon lifecycle, a system tray, and native notifications. A thin native chrome over the existing web UI, not a UI rewrite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "aivyx-desktop"
path = "src/main.rs"

[dependencies]
aivyx-instance = { path = "../aivyx-instance" }
# Windowing + event loop (the tauri-ecosystem winit fork; pairs with wry and the
# tray-icon / global-hotkey crates which integrate with its event loop).
tao = "0.35"
# The system webview (WebKitGTK on Linux, WebView2 on Windows, WKWebView on
# macOS). On Linux this needs the `webkit2gtk-4.1` runtime/dev package — the one
# real native dependency of the desktop shell.
wry = "0.55"
# System tray / menu-bar icon + its menu (re-exports `muda` as `tray_icon::menu`).
# On Linux the tray uses GTK + an appindicator at runtime.
tray-icon = "0.21"
# Decode the embedded tray PNG to RGBA for `tray_icon::Icon`.
png = "0.17"

# Native approval-gate notifications: a background WebSocket client polls the
# daemon for missions awaiting approval (the same TeamMissionList the Studio
# polls) and fires an OS notification on each new gate.
aivyx-ipc = { path = "../aivyx-ipc" }        # the shared wire protocol (native-clean)
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite = "0.29"
futures-util = { workspace = true }
serde_json = { workspace = true }
notify-rust = "4"                            # dbus desktop notifications

# Global hotkey to summon the window + launch-on-login. global-hotkey uses X11
# on Linux (best-effort — a Wayland-only session can't grab globally); the
# autostart entry is a `~/.config/autostart/*.desktop` file on Linux.
global-hotkey = "0.8"
auto-launch = "0.6"

# Excluded from `dist` — the desktop shell links a system webview, so it can't be
# the musl-static release artifact the CLI uses. It's packaged separately
# (cargo-bundle, gnu-linked) by `.github/workflows/desktop-release.yml`; dist=false
# keeps cargo-dist from trying to build it on the musl/macOS CLI matrix.
[package.metadata.dist]
dist = false

# Native packaging via `cargo-bundle` (`cargo bundle --release`): a `.deb` on
# Linux and a `.app`/`.dmg` on macOS. The Linux `.deb` declares the shell's
# system runtime deps so an install pulls them in (Debian/Ubuntu names; the
# desktop CI runs on Ubuntu).
[package.metadata.bundle]
name = "Aivyx PA"
identifier = "com.aivyx-pa.desktop"
icon = ["assets/icon-256.png"]
category = "Utility"
short_description = "Aivyx PA — your personal AI assistant, in a native window."
long_description = """
The native desktop app for Aivyx PA: a system-tray assistant that hosts the local
Studio, manages the daemon, and notifies you when a mission needs your approval.
"""
deb_depends = [
    "libwebkit2gtk-4.1-0",
    "libayatana-appindicator3-1",
    "libxdo3",
]
