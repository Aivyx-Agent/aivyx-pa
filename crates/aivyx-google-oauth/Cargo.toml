[package]
name = "aivyx-google-oauth"
description = "Shared Google OAuth substrate for Aivyx tool processes (Phase 129 lift — Chapter F #3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
aivyx-instance = { path = "../aivyx-instance" }
# HTTP + JSON — matches the workspace's rustls-only TLS posture.
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime (file I/O for token persistence + reqwest's
# async client).
tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "fs", "macros"] }

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "fs"] }
