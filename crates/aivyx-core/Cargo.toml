[package]
name = "aivyx-core"
description = "Agent trait, turn loop, and core types for the Aivyx agent framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
aivyx-capability = { path = "../aivyx-capability" }
aivyx-llm = { path = "../aivyx-llm" }
# KV-cache persistence against a llama-server backend (`LlmPlanner::with_kv_cache`).
# Pinned by commit, not a version, since this crate isn't published — see
# aivyx-kvcache's own CLAUDE.md for the repo's release status. Pin lives in
# the workspace root's [workspace.dependencies].
aivyx-kvcache = { workspace = true }
# Phase 51 Task 2 — D6 typed nested errors for AivyxError::Storage /
# Crypto. The Phase 1 TODOs in lib.rs:689,693 are finally closed.
# Adding these as deps was deliberately deferred at Phase 1; both
# crates are leaf-side (aivyx-storage → aivyx-crypto, aivyx-crypto →
# nothing in-workspace) so the dep graph remains acyclic.
aivyx-storage = { path = "../aivyx-storage" }
aivyx-crypto = { path = "../aivyx-crypto" }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "process"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

# Phase 12 Task 2 — web.fetch tool. Already in the workspace
# through aivyx-llm; promoting to a direct dep here so the
# tool lives next to shell.exec rather than behind a feature
# flag in the LLM crate. Zero new workspace deps.
reqwest = { workspace = true }
futures-util = { workspace = true }

# Phase 37 — base64 encoding for binary response bodies in
# web.fetch. Already transitive via reqwest/rustls; promoting
# to a direct dep. Zero new Cargo.lock entries.
base64 = { workspace = true }

# Phase 42 — process-group signaling for shell.exec. Already
# transitive via cc/aws-lc-sys; promoting to direct dep so
# shell.rs can call killpg(). Zero new Cargo.lock entries.
libc = { workspace = true }

# Phase 101 — JSON Schema validation of tool-call inputs in the
# planner's validate-before-dispatch step. `default-features =
# false` per the root Cargo.toml comment (no `$ref` resolution
# backends, no second TLS stack). First net-new workspace
# dependency since Phase 27's `notify`.
jsonschema = { workspace = true }
dom_smoothie = "0.18.0"

# Shared Landlock+seccomp process confinement for shell.exec/git.rs,
# re-exported so aivyx-cli never needs its own direct dependency on it.
# Target-gated: `aivyx-confine`'s `sandbox-backend` feature (its
# `default`, disabled at the workspace-dependency level — see root
# Cargo.toml's comment for why) pulls in `landlock`/`seccompiler`, which
# call Linux-only libc syscalls (`SYS_landlock_create_ruleset` etc.) — a
# plain unconditional dependency on it here would break the macOS release
# build (`aivyx-core` is a dependency of every shipped binary, including
# the two macOS targets in `dist-workspace.toml`). Only the Linux table
# opts `sandbox-backend` back on; everywhere else `aivyx-confine` builds
# with just `NoopConfiner`/`ExecutionConfiner`/`default_confiner` —
# `default_confiner` already picks the right backend per-platform, so no
# calling code needs to know which build this is.
[target.'cfg(target_os = "linux")'.dependencies]
aivyx-confine = { workspace = true, features = ["sandbox-backend"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
aivyx-confine = { workspace = true }

# Shared git-ref checkpoint/rollback for fs_root's mutating tools, gating
# ConcreteAgent's dispatch hook on Tool::mutates_fs_root(). Re-exported
# below so aivyx-cli never needs its own direct dependency on it — same
# pattern as the aivyx-confine re-export just above.
#
# Declared via the `[dependencies.name]` sub-table form rather than the
# inline `aivyx-checkpoint = { workspace = true }` form: a plain
# unheadered entry placed here (after the two `[target.'cfg(...)']`
# tables above) would be parsed by TOML as belonging to the most
# recently opened table — the non-Linux target table — not the
# top-level [dependencies] table, and would silently vanish from the
# Linux build. Confirmed empirically (`cargo metadata` on a
# minimal repro) before choosing this form. `aivyx-checkpoint` has no
# platform split, unlike aivyx-confine, so it belongs here untargeted.
[dependencies.aivyx-checkpoint]
workspace = true

[dependencies.aivyx-injection-guard]
workspace = true

[dependencies.aivyx-skills]
workspace = true

# Chapter Rampart hardening — `egress::host_of` delegates to url::Url
# instead of hand-rolled string splitting, so it parses exactly the way
# reqwest does internally (see workspace Cargo.toml comment on `url`).
[dependencies.url]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "process"] }
# Confinement test fixture (Task 3 — shell.exec confinement): needs a
# directory outside cwd_root's default write scope. Pinned to match
# aivyx-confine's own dev-dependency version so Cargo.lock gains no
# second resolution.
tempfile = "3.27.0"
