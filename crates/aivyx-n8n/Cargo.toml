[package]
name = "aivyx-n8n"
description = "n8n workflow automation third-party tool process for Aivyx (Phase 131 — Chapter F #7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aivyx-n8n"
path = "src/main.rs"

[dependencies]
aivyx-instance = { path = "../aivyx-instance" }
aivyx-tool = { path = "../aivyx-tool" }
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
# Phase 132 substrate — shared auth_cli.
aivyx-auth-cli = { path = "../aivyx-auth-cli" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "io-std", "fs"] }
async-trait = { workspace = true }

reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }

toml = "0.8"

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "fs"] }

# Excluded from `dist` releases — only the top-level `aivyx` binary is
# published as a release artifact. This tool-process binary ships with
# the daemon / is built from source, not as a standalone download.
[package.metadata.dist]
dist = false
