[package]
name = "aivyx-channel"
description = "ChannelContext trait and LocalChannel reference implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

# `aivyx-voice` is an optional dep pulled only by the `channel-voice` feature
# (`dep:aivyx-voice`); cargo-machete can't see feature-gated optional deps and
# false-flags it as unused.
[package.metadata.cargo-machete]
ignored = ["aivyx-voice"]

[features]
default = []
# Phase 134 — embedded Rust-native inference via mistral.rs. Opt-in
# at the channel-crate level so the binary's `cargo build` doesn't
# always pull in the substantial mistralrs dependency tree. The
# feature forwards through to `aivyx-llm/provider-mistral-rs`.
provider-mistral-rs = ["aivyx-llm/provider-mistral-rs"]
provider-mistral-rs-cuda = ["aivyx-llm/provider-mistral-rs-cuda"]
provider-mistral-rs-metal = ["aivyx-llm/provider-mistral-rs-metal"]
provider-mistral-rs-accelerate = ["aivyx-llm/provider-mistral-rs-accelerate"]
# Phase 134 — `recommended-providers` meta-feature. Pulls in the
# embedded provider on top of the three already-enabled
# out-of-process providers (Anthropic / OpenAI / Ollama, hard-wired
# below). New users running
# `cargo install --features recommended-providers aivyx` get a
# single binary with every Phase 134 local-LLM story available.
# Operators who want lean builds use `cargo install aivyx` (no
# feature flag) and get Ollama-only.
recommended-providers = ["provider-mistral-rs"]

# Phase 135 — voice channel feature. Opt-in like the
# embedded LLM provider; pulls in the aivyx-voice crate
# (cpal + rodio + optional whisper-rs / piper1-rs
# behind aivyx-voice's own feature flags).
channel-voice = ["dep:aivyx-voice"]
# Convenience: bundle the recommended ASR + TTS engines
# (whisper-rs + Piper) on top of the bare voice channel.
# `cargo install --features channel-voice-full aivyx-channel`
# is the one-liner install. Operators on lean builds use
# `--features channel-voice` alone and wire their own
# engine (Phase 136+ alternative engine candidate).
channel-voice-full = ["channel-voice", "aivyx-voice/recommended-voice"]

[dependencies]
# Phase 135 — voice channel optional dep.
aivyx-voice = { path = "../aivyx-voice", optional = true }
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
# Phase 14 Task 1 — `aivyx-config` promoted from binary-only to a
# library dependency because `assemble_role_envelope` lifted into
# `src/role_envelope.rs` takes `aivyx_config::Role` as a parameter.
# The Phase 9 comment below (in the former binary-only block) said
# "aivyx-channel's library target has nothing to configure," which
# was true pre-Phase-13. Phase 13 made per-role envelope assembly a
# first-class library concern and Phase 14 Task 1 is the consumer
# that pulled the dep up into the lib tier. The library surface
# stays narrow: only `Role` (and its transitive `Sourced<T>` /
# `FieldSource` types via the `capability_scopes.value` field) are
# touched.
aivyx-config = { path = "../aivyx-config" }
async-trait = { workspace = true }
# Phase 16 Task 2 — promoted from dev-dep to prod dep because
# `daemon_ipc.rs` uses serde_json for the IPC wire format
# (length-prefixed JSON frames per docs/DAEMON_IPC.md). Already a
# workspace dep via aivyx-core, aivyx-audit, aivyx-llm, aivyx-memory.
serde_json = { workspace = true }
serde = { workspace = true }

# Phase 5 task 3 — the passphrase module derives a MasterKey via
# aivyx-crypto's Argon2id entry and tests the full passphrase →
# storage round-trip against aivyx-storage. Both are library-level
# deps (not binary-only) because the `passphrase` module is part of
# the lib target.
aivyx-crypto = { path = "../aivyx-crypto" }
aivyx-storage = { path = "../aivyx-storage" }
thiserror = { workspace = true }

# Zeroize the transient passphrase buffer between "passphrase sourced"
# and "master key derived." aivyx-crypto pins the same 1.8 line and
# exposes `Zeroize` on its key types, so keeping aivyx-channel on the
# same major avoids trait-object fragmentation.
zeroize = "1.8"

# Phase 7 task 4 — the `passphrase` module's `InteractivePrompt`
# source calls `rpassword::prompt_password("aivyx passphrase: ")`
# in production and `rpassword::prompt_password_from_bufread` in
# unit tests. `rpassword` is a thin wrapper around termios/ConIn
# echo-disable plus a line read; it has no transitive async deps.
# Pinned to `^7` (today 7.4.0) to match the current stable line.
rpassword = "7"
# Chapter Keyring — OS credential store for the master passphrase.
keyring = { workspace = true }

# Phase 68 — SMTP transport for the email notify backend.
# Workspace dep with `default-features = false` + explicit
# rustls features (see root Cargo.toml). `secrecy` is already
# present above for the existing api-key / passphrase paths.
lettre = { workspace = true }

# Binary-only deps below. The library target (lib.rs) only needs the
# entries above; the `aivyx` bin pulls in the rest so a single
# `cargo run --bin aivyx` launches the full agent stack.
aivyx-audit = { path = "../aivyx-audit" }
# Chapter K — the loop's per-run dollar cap prices LlmCost chain events.
aivyx-cost = { path = "../aivyx-cost" }
# Chapter L — the daemon runs Nonagon team missions (TeamRuntime + the
# MissionPlan/MissionReport types the TeamMission store persists).
aivyx-team = { path = "../aivyx-team" }
# Chapter M.2 — the wasm-clean wire protocol crate. The TeamMission data types
# moved here (shared with the browser app); aivyx-channel re-exports + adds the
# encrypted storage CRUD over them.
aivyx-ipc = { path = "../aivyx-ipc" }
# POLISH_WAVES.md sub-project 7, item B — the test-connection probe reuses
# the same McpServerBridge/transport connect calls aivyx-cli's own boot-time
# startup loop uses.
aivyx-mcp = { path = "../aivyx-mcp" }
aivyx-llm = { path = "../aivyx-llm", features = ["provider-anthropic", "provider-openai", "provider-ollama"] }
# Model routing Part 3a — `CompletionJudge::with_route_task` tags the loop
# completion judge's request `TaskKind::Judge` (a no-op on a non-routed
# provider).
aivyx-route = { workspace = true }
# KV-cache persistence against a llama-server backend — `TeamRunDeps.kv_cache_handles`
# threads the daemon's shared pool/store through to every team mission's
# specialist turns. Pinned by commit, not a version, since this crate isn't
# published — see aivyx-kvcache's own CLAUDE.md for the repo's release status.
# Pin lives in the workspace root's [workspace.dependencies].
aivyx-kvcache = { workspace = true }

# Phase 8 Task 4 — `aivyx --channel telegram` delegates into
# `aivyx_telegram::run_telegram_session`. The dep is binary-only
# (library consumers of `aivyx-channel` don't need the Telegram
# adapter), but cargo's workspace resolver folds it into the
# `aivyx-channel` compilation unit anyway. Alphabetical ordering
# relative to the other `aivyx-*` deps would cluster this up with
# `aivyx-audit`, but Phase 8 prefers appending new deps to the
# bottom of the binary-only block so the task-provenance comment
# history stays readable.
aivyx-telegram = { path = "../aivyx-telegram" }
# Phase 107 — Discord channel adapter. Same binary-only-import
# pattern as `aivyx-telegram`: the `aivyx` binary calls
# `aivyx_discord::run_discord_session` for the
# `--channel discord` path and the daemon's
# `discord_daemon_frontend` consumes the IPC types directly.
aivyx-discord = { path = "../aivyx-discord" }
# Phase 108 — Slack channel adapter. Same binary-only-import
# pattern as `aivyx-telegram` and `aivyx-discord`. The
# production transport is currently stubbed (Phase-108-internal
# deferral bundled with the Phase 107 daemon-frontend
# follow-on) so `--channel slack` runs end-to-end at the
# session-driver layer but the live Socket Mode wiring lands
# alongside the Discord daemon-frontend.
aivyx-slack = { path = "../aivyx-slack" }

# Phase 9 Task 3 — unified config loader. The binary's ten
# `std::env::var` call sites collapse into a single
# `AivyxConfig::load_from_env_and_toml` + `hydrate_secrets_from_store`
# pair. This dep was binary-only at Phase 9 open and was promoted to
# a library dependency in Phase 14 Task 1 (see the `[dependencies]`
# block above) when `assemble_role_envelope` lifted from this binary
# into the lib target and started taking `aivyx_config::Role`.

# Phase 6 task 4 — the binary constructs a `RedbMemory` from the
# same `Arc<dyn Storage>` it already opens for the session marker,
# wraps it in `Arc<dyn Memory>`, and registers the three
# MemoryRead/Write/ForgetTool impls alongside the fs tools. The
# library target does not pull this in (the Phase 3 chat-only
# regression test still passes an empty registry and constructs
# SessionConfig without a Memory handle).
aivyx-memory = { path = "../aivyx-memory" }
# Phase 16 Task 3 — added "net" and "io-util" for daemon_server.rs and
# daemon_client.rs (UnixListener, UnixStream, AsyncReadExt, AsyncWriteExt).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "signal", "net", "io-util", "sync"] }
secrecy = { workspace = true }
# Phase 45 — base64 decoding for IPC image attachments.
base64 = { workspace = true }
# Salt bytes for the passphrase module — uuid::Uuid::new_v4() is the
# workspace standard entropy source, same choice aivyx-storage makes
# for its AEAD nonces.
uuid = { workspace = true }
cron = { workspace = true }
chrono = { workspace = true }
# Phase 27 Task 3 — webhook trigger listener. hyper is already a
# transitive dep via reqwest; promoting to a direct dep adds no new
# Cargo.lock entries.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
# Phase 27 Task 4 — file-watch trigger. Cross-platform filesystem
# notification (inotify on Linux, FSEvents on macOS, ReadDirectoryChanges
# on Windows). First genuinely new Cargo.lock entry since Phase 26's
# `cron` crate.
notify = { workspace = true }
# Phase 59 — Persona substrate per PRODUCT.md P14. The Persona
# chain is HMAC-SHA256-chained, structurally parallel to the audit
# chain. We re-use the same crypto primitives `aivyx-audit` does
# (already in Cargo.lock as transitive deps); listing them directly
# here makes the dep relationship explicit.
hmac = { workspace = true }
sha2 = { workspace = true }
serde_jcs = { workspace = true }
# Phase 36 — Ollama model management tools use reqwest directly for
# Ollama REST API calls (GET /api/tags, POST /api/show, POST /api/pull).
# Already a workspace dep and transitive via aivyx-core.
reqwest = { workspace = true }
# Phase 39 — WebSocket support for the web UI channel. Each browser
# connection upgrades HTTP to WebSocket, then bridges JSON frames to
# the daemon's Unix socket IPC.
tokio-tungstenite = { workspace = true }
# Phase 39 — StreamExt/SinkExt for splitting the WebSocket stream
# into independent read/write halves. Already a workspace dep via
# aivyx-llm's SSE parser.
futures-util = { workspace = true }

[dev-dependencies]
# LocalChannel unit tests exercise the async ChannelContext surface
# against an in-memory Vec<u8> sink; tokio drives #[tokio::test] and
# serde_json builds the tool-call inputs the tests feed in.
# Phase 16 Task 3 — added "net", "time" for the daemon_roundtrip_e2e integration test.
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
serde_json = { workspace = true }

# Phase 185 — the `aivyx` binary was extracted to the `aivyx-cli`
# crate. It depends on both this crate and `aivyx-tui`; keeping it
# here would form an `aivyx-channel → aivyx-tui → aivyx-channel`
# package cycle (Cargo rejects it), since `aivyx-tui` depends on this
# crate for `DaemonSession` + the IPC types. aivyx-channel is now a
# pure library crate.
