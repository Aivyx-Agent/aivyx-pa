[package]
name = "aivyx-web"
description = "Chapter M — the browser Mission-Control GUI: a Dioxus (Rust→WASM) client that speaks the daemon's wire protocol via the shared, wasm-clean aivyx-ipc crate. Compiles only for wasm32-unknown-unknown (web-sys / wasm-bindgen); excluded from the workspace's default-members."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# The single source of wire truth — shared with the daemon, no JS mirror.
aivyx-ipc = { path = "../aivyx-ipc" }
# Keep Dioxus's default features (macro / signals / hooks / launch) and add the
# web renderer; the defaults are renderer-agnostic, so no native deps leak.
dioxus = { version = "0.6", features = ["web"] }
# Browser WebSocket as a futures Stream + Sink.
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
# `sink` brings SinkExt + StreamExt::split for the WebSocket halves.
futures-util = { version = "0.3", features = ["sink"] }
serde_json = { workspace = true }
# `MouseEvent`/`Event`/`UiEvent`/`EventTarget` back the Guide screen's
# click-delegation: the rendered markdown is injected as raw HTML, so its
# cross-page `<a>` links aren't Dioxus-managed — the panel catches clicks on the
# container, finds the target anchor (`Element::closest`/`get_attribute`), and
# switches page in-app.
# `Storage` remembers which sidebar groups are open (`nav_state`).
# `HtmlHeadElement`/`HtmlScriptElement` back the mermaid.js loader in
# `FileViewer`: it appends a real `<script>` element to `<head>` (a
# `dangerous_inner_html`-injected `<script>` tag never executes per spec).
web-sys = { version = "0.3", features = ["Location", "Window", "Document", "Element", "Event", "UiEvent", "MouseEvent", "KeyboardEvent", "EventTarget", "HtmlHeadElement", "HtmlScriptElement", "Storage"] }
# `Date::now()` for relative timestamps in the Command Center audit feed.
js-sys = "0.3"
# `JsCast` for casting the click target to an `Element` in the Guide screen's
# link delegation. Already in the tree transitively; named directly for the
# `dyn_ref` import.
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# End-user guide (the in-app Guide screen): the docs/guide/*.md pages are
# bundled with include_str! and rendered to HTML at runtime. Pure-Rust, no_std-
# friendly, wasm-clean; `default-features = false` drops the CLI `getopts` dep we
# don't need, keeping just the parser + the `html` renderer.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# Excluded from `dist` releases. This crate is the browser GUI and compiles
# ONLY for wasm32-unknown-unknown (web-sys / wasm-bindgen); cargo-dist would
# otherwise try to build it natively for the Linux/macOS release targets and
# fail. Only the top-level `aivyx` binary is published as a release artifact.
[package.metadata.dist]
dist = false
