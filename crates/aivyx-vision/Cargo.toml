[package]
name = "aivyx-vision"
description = "Tool process exposing vision.generate_svg, backed by the standalone aivyx-vision-svg crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aivyx-vision"
path = "src/main.rs"

[dependencies]
# Tool process SDK — same shape as aivyx-toolkit/aivyx-gmail. Not workspace
# dependencies: aivyx-core/aivyx-tool/aivyx-llm are internal path deps with
# no [workspace.dependencies] entry, consistent with every other consumer
# in this workspace (see e.g. aivyx-toolkit's own Cargo.toml).
aivyx-capability = { path = "../aivyx-capability" }
aivyx-core = { path = "../aivyx-core" }
aivyx-tool = { path = "../aivyx-tool" }
# text_completer::build_provider wires a real LlmProvider from this
# crate's own config, so all three concrete providers' feature gates need to
# be on -- each of aivyx-llm's `ollama`/`anthropic`/`openai` modules is
# itself `#[cfg(feature = "provider-*")]`.
aivyx-llm = { path = "../aivyx-llm", features = [
    "provider-ollama",
    "provider-anthropic",
    "provider-openai",
] }

# Standalone SVG-generation backend this tool process wraps.
aivyx-vision-svg = { workspace = true }
aivyx-vision-core = { workspace = true }
aivyx-vision-mold = { workspace = true }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# rt-multi-thread + macros are already part of the workspace's base tokio
# feature set (see [workspace.dependencies] in the root Cargo.toml), so no
# extra features are needed here.
tokio = { workspace = true }
tokio-util = { workspace = true }
secrecy = { workspace = true }

# Not a workspace dependency — pinned directly per-crate, matching every
# other TOML-config-reading tool process (aivyx-toolkit, aivyx-gmail,
# aivyx-calendar, aivyx-notion, ...).
toml = "0.8"

[dev-dependencies]
# Not a workspace dependency — pinned directly per-crate, matching
# aivyx-core/aivyx-team's own dev-dependency version.
tempfile = "3.27.0"

# aivyx-vision-core's `FakeGenerationProvider` test double is gated behind
# its own `testing` Cargo feature (`#[cfg(any(test, feature = "testing"))]`
# in that crate -- `test` there only applies to aivyx-vision-core's own
# `cargo test`, not to this crate's). Listed here, in [dev-dependencies]
# only, so the feature is enabled for this crate's own test builds without
# leaking into normal (non-test) builds of aivyx-vision or anything that
# depends on it -- resolver "2" (this workspace's resolver, and required by
# edition 2024) keeps dev-dependency feature unification scoped to this
# package's own test target.
aivyx-vision-core = { workspace = true, features = ["testing"] }

# Excluded from `dist` releases — only the top-level `aivyx` binary is
# published as a release artifact. This tool-process binary ships with
# the daemon / is built from source, not as a standalone download.
[package.metadata.dist]
dist = false
