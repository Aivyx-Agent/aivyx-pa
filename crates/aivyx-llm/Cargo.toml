[package]
name = "aivyx-llm"
description = "LlmProvider trait and reference implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
# Opt-in: pulls in reqwest + rustls + secrecy and compiles the Anthropic
# reference provider. Downstream crates (e.g. aivyx-core) that only need
# the LlmProvider trait and LlmError must NOT enable this feature.
provider-anthropic = [
    "dep:reqwest",
    "dep:secrecy",
    "dep:futures-util",
    "dep:bytes",
]
provider-openai = [
    "dep:reqwest",
    "dep:secrecy",
    "dep:futures-util",
    "dep:bytes",
]
# Phase 121 — native Ollama adapter against `/api/chat` (JSONL
# streaming). Distinct from `provider-openai`'s Ollama-via-OpenAI-compat
# path; the two coexist so the OpenAI-compat code stays for
# `ProviderKind::OpenAi`. Pulls in the same transport deps as the
# other providers.
provider-ollama = [
    "dep:reqwest",
    "dep:secrecy",
    "dep:futures-util",
    "dep:bytes",
]
# Phase 134 — Direction B: embedded Rust-native inference via
# the `mistralrs` crate. CPU baseline; backend acceleration is
# gated behind sibling features below (no backend gating on
# this baseline = pure-Rust CPU build, which is what we want
# as the minimal Aivyx-builds-anywhere posture). Pulls in the
# mistralrs crate (substantial: ~candle + tokenizers + hf-hub
# + the model architectures). Initial build estimated at
# 5-10 min.
provider-mistral-rs = [
    "dep:mistralrs",
    "dep:futures-util",
]
# Sibling backend gates — each forwards to the matching
# mistralrs feature. The Aivyx-side names mirror the
# Aivyx feature naming convention (`provider-mistral-rs-<backend>`)
# rather than mistralrs's bare `cuda` / `metal` to avoid
# colliding with any future Aivyx-side `cuda` feature.
provider-mistral-rs-cuda = [
    "provider-mistral-rs",
    "mistralrs?/cuda",
]
provider-mistral-rs-metal = [
    "provider-mistral-rs",
    "mistralrs?/metal",
]
provider-mistral-rs-accelerate = [
    "provider-mistral-rs",
    "mistralrs?/accelerate",
]

[dependencies]
# Protocol-only core — no dependency on aivyx-core. The LlmProvider
# trait and its associated types use `serde_json::Value` for tool
# inputs/outputs and `tokio_util::sync::CancellationToken` for mid-
# stream cancellation; neither requires core types.
async-trait = { workspace = true }
aivyx-route = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }

# Feature-gated: only compiled when `provider-anthropic`, `provider-openai`,
# or `provider-ollama` is on. Keeping these optional means `aivyx-core`
# (which depends on this crate purely for LlmError) never links
# reqwest/rustls/secrecy. kvcache adoption's kvcache_probe gates
# fetch_llama_slots_info behind the same feature set.
reqwest = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

# Phase 134 — embedded inference via mistral.rs. Pinned to
# `=0.8.*` per the open doc's pre-1.0 contract: mistralrs is
# pre-1.0 semver, API may churn between minor versions;
# Aivyx-side upgrades happen explicitly per-phase. Default-
# featureless (we never want the dep to silently turn on
# CUDA / Metal at the Aivyx feature layer).
mistralrs = { version = "=0.8.*", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# Chapter Stencil (ST.1) — validate the generated tool-call grammar
# admits valid calls and rejects hallucinated names / bad arguments.
# Already a vetted workspace dependency (aivyx-core); test-only here.
jsonschema = { workspace = true }
