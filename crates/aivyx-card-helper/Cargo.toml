[package]
name = "aivyx-card-helper"
version.workspace = true
edition = "2024"
license = "BUSL-1.1"
publish = false
description = "The aivyx-pa-card helper: OpenPGP-card ECDH for card unlock (A18)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
secrecy = { workspace = true }
# "derive" is needed by aivyx-yubi (decrypt.rs), which does not enable it itself.
zeroize = { version = "1.8", features = ["derive"] }
thiserror = { workspace = true }
x25519-dalek = { workspace = true, optional = true }
aivyx-yubi = { workspace = true, optional = true }
openpgp-card = { version = "0.7", optional = true }

[features]
card = ["dep:aivyx-yubi", "dep:openpgp-card"]
test-util = ["dep:x25519-dalek"]

[dev-dependencies]
x25519-dalek = { workspace = true }
aivyx-yubi = { workspace = true, features = ["test-util"] }
tempfile = "3"

[[bin]]
name = "aivyx-pa-card"
path = "src/main.rs"
required-features = ["card"]
