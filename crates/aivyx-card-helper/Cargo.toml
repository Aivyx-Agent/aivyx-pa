[package]
name = "aivyx-card-helper"
version.workspace = true
edition = "2024"
license = "BUSL-1.1"
publish = false
description = "The aivyx-pa-card helper: OpenPGP-card ECDH for card unlock (A18)"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
secrecy = { workspace = true }
zeroize = "1.8"
thiserror = { workspace = true }
x25519-dalek = { workspace = true, optional = true }
aivyx-yubi = { workspace = true, optional = true }

[features]
card = ["dep:aivyx-yubi"]
test-util = ["dep:x25519-dalek"]

[dev-dependencies]
x25519-dalek = { workspace = true }
aivyx-yubi = { workspace = true, features = ["test-util"] }
tempfile = "3"
