[package]
name = "aivyx-dataread"
description = "Structured-data reader tools for Aivyx (Chapter Sheaf — csv/xlsx/pdf over fs.read)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The Tool trait + the fs sandbox helper (`lexical_resolve`, pub since
# Chapter Z) these readers reuse — they add no new capability, only
# parse bytes the agent could already `fs.read`.
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# CSV parsing (Chapter Sheaf SH.1). Already in the workspace dep tree;
# MIT/Unlicense — permissive, clears deny.toml.
csv = "1"

# XLSX spreadsheet parsing (Chapter Sheaf SH.2). MIT — permissive,
# clears deny.toml. Reads the binary zip+XML format `fs.read` cannot
# expose; parsed in-memory from the sandbox-read bytes (no temp files).
calamine = "0.36"

# PDF text extraction (Chapter Sheaf SH.3). MIT; brings `lopdf` (also
# used directly for the page count, and now for `data.pdf.write`'s
# low-level content-stream construction — SH.6). Text EXTRACTION is
# layer-only, no OCR; `data.pdf.write` is plain single-font text flow,
# no rich formatting.
# lopdf >= 0.42 fixes RUSTSEC-2026-0187 (unbounded-recursion stack-overflow
# DoS on a crafted PDF); pdf-extract 0.9+ tracks the same lopdf line.
pdf-extract = "0.12"
lopdf = "0.42"

# XLSX spreadsheet WRITING (Chapter Sheaf SH.6 — `data.xlsx.write`,
# symmetric with SH.2's reader). MIT — permissive, clears deny.toml.
# Was a dev-only test-fixture dependency (SH.5); promoted to a real
# dependency now that the crate ships a writer, not just readers.
rust_xlsxwriter = "0.79"

[dev-dependencies]
# Drives the in-process readers' async `execute()` in the live-verify.
tokio = { workspace = true, features = ["rt", "macros"] }

[package.metadata.dist]
dist = false
