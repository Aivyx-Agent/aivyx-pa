[package]
name = "aivyx-ipc"
description = "The daemon ↔ client wire protocol (Chapter M) — wasm-clean shared types so the browser Mission-Control app and the daemon serialize from one source of wire truth. No async / storage / network deps; compiles to wasm32. Seeded with the team-mission types (M.2a); the full IPC envelope + remaining embedded data types land in later M.2 slices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# The mission DAG + roster types the wire carries (TeamRun { plan, config }).
aivyx-team-types = { path = "../aivyx-team-types" }
# Chapter Almanac — `TrustTier` embedded directly in `ToolCatalogEntry`.
# No storage/network/async deps of its own (serde + globset only), so it
# stays wasm32-clean like the rest of this crate.
aivyx-capability = { path = "../aivyx-capability" }
# Task 3: Instance paths and names for multi-instance support.
aivyx-instance = { path = "../aivyx-instance" }
serde = { workspace = true }
# LearnedSkill::{to,from}_json_value (persona) serialize through serde_json.
serde_json = { workspace = true }
