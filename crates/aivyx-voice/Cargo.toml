[package]
name = "aivyx-voice"
description = "Voice I/O channel (mic ASR + speaker TTS) for the Aivyx agent (Phase 135)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Default is empty so `cargo check -p aivyx-voice` builds the
# trait surfaces + conversion substrate cleanly without
# requiring system-level prereqs (whisper.cpp build chain,
# ONNX runtime headers). Operators opt into engines explicitly
# via the per-engine features below, or use the
# `recommended-voice` meta-feature on `aivyx-channel` for the
# one-liner install.
default = []

# ASR backends — pick exactly one for a meaningful build. Both
# features can be enabled simultaneously; the operator picks
# at runtime via the [voice] config section. Default
# recommendation is `asr-whisper-rs` (mature, large community,
# same engine that powers most Whisper projects globally).
asr-whisper-rs = ["dep:whisper-rs"]
# Phase 135 Q2c alternative — whisper-cpp-plus.
#
# **Scope-adjusted from Q2c sign-off.** The published
# `whisper-cpp-plus = "0.1.4"` does not build against
# current whisper.cpp (40 errors against
# `whisper_full_params` struct shape — upstream-stale).
# Phase 135 keeps the feature flag wired for future
# re-enablement but does NOT depend on the broken crate;
# enabling the feature compiles the stub module only.
# Phase 136+ revisits when an upstream fix lands or
# we swap to a different alternative binding
# (rwhisper, whisper-stream-rs, etc.).
asr-whisper-cpp-plus = []

# TTS backend — the permissive Kokoro stack (Chapter Timbre).
#
# Kokoro-82M (Apache-2.0 weights) via `ort` (ONNX Runtime,
# Apache/MIT) with `voice-g2p` (MIT, dictionary-based,
# **espeak-free**) G2P. No GPL anywhere; `ort`'s default
# `download-binaries` fetches a prebuilt ONNX Runtime at build
# time, so there are no system ONNX headers or espeak-ng
# prereqs. `zip` parses the Kokoro `voices-*.bin` npz.
#
# (The GPL-3.0 Piper engine — piper1-rs → espeak-ng — was removed
# in TB.3; see docs/TIMBRE.md.)
tts-kokoro = ["dep:ort", "dep:ndarray", "dep:zip", "dep:voice-g2p"]

# Convenience meta-feature: the recommended voice loop —
# whisper-rs STT + Kokoro TTS. `cargo install` users pull this
# through `aivyx-channel/channel-voice-full`.
recommended-voice = ["asr-whisper-rs", "tts-kokoro"]

[dependencies]
# Aivyx substrate.
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }

# Async + trait infrastructure.
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "io-std", "process"] }

# Config + error handling.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Phase 156 — `/image <url>` source. reqwest
# already a workspace dep via aivyx-llm /
# aivyx-toolkit / etc.; aivyx-voice adds as a
# crate dep (matching Phase 141's chrono
# pattern for aivyx-calendar).
reqwest = { workspace = true }

# Phase 168 — futures_util for the streaming
# body read in fetch_image_url (read-stall
# timeout substrate). Already a workspace dep
# via aivyx-calendar / aivyx-drive (Phase 151
# / Phase 157); aivyx-voice adds as a crate
# dep matching the same pattern.
futures-util = { workspace = true }

# Backoff-jitter randomness (F6). `Uuid::new_v4()` is the
# getrandom-backed CSPRNG the rest of Aivyx already trusts for
# salts / nonces, so the backoff jitter draws from the same
# source instead of SystemTime nanos. Workspace dep already.
uuid = { workspace = true }

# Audio I/O — always on inside aivyx-voice. cpal is the
# pure-Rust cross-platform audio library Aivyx already uses
# transitively through other channels; pinning here for
# stability. rodio sits on top of cpal for playback.
cpal = "0.17"
# rodio defaults pull in decoders (flac, mp3, mp4, vorbis, wav)
# we don't need — Piper outputs PCM samples directly into a
# SamplesBuffer. We need exactly the `playback` feature for
# the cpal-backed output sink.
rodio = { version = "0.22", default-features = false, features = ["playback"] }

# Phase 135 deliberately does NOT depend on a VAD library.
# Push-to-talk MVP uses Enter-to-start + Enter-to-stop, no
# silence detection needed. Phase 136+ continuous-listening
# mode will add Silero VAD (likely `silero` crate, MIT/Apache).

# Optional ASR backends — see [features] above.
whisper-rs = { version = "0.16", optional = true }
# whisper-cpp-plus deliberately omitted — upstream
# v0.1.4 doesn't build against current whisper.cpp.
# See `asr/whisper_cpp_plus.rs` for the full
# scope-adjustment rationale. Re-enable when an
# upstream fix lands.

# Chapter Timbre — permissive Kokoro TTS stack. All MIT /
# Apache-2.0; no espeak-ng, no GPL. Pinned to the rc the engine
# was written against (the ort 2.0 pre-release API still moves
# between rc's). `ort` default features include `download-binaries`
# (prebuilt ONNX Runtime, MIT) so no system lib is required.
ort = { version = "2.0.0-rc.10", optional = true }
ndarray = { version = "0.17", optional = true }
# Kokoro `voices-*.bin` is an npz (zip of .npy); deflate only.
zip = { version = "9", optional = true, default-features = false, features = ["deflate"] }
# MIT, pure-Rust, dictionary-based English G2P (no espeak-ng linked
# — espeak is only an optional runtime exec fallback, never a build
# dep, so nothing GPL enters the link graph). Outputs Kokoro IPA.
voice-g2p = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# Used by config-deserialization tests to verify the
# `[voice]` section round-trips through TOML.
toml = "0.8"
