[package]
name = "aivyx-gmail"
description = "Gmail third-party tool process for Aivyx (Phase 123 — Chapter F #1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aivyx-gmail"
path = "src/main.rs"

[dependencies]
# Tool process SDK — wire envelopes + harness primitives. Phase 123
# uses the wire types directly and writes a multi-tool harness
# inline (single-tool `run_tool_as_subprocess` doesn't fit Gmail's
# four-tool process; documented as the Phase 123 SDK-validation
# finding for follow-up substrate work in a future phase).
aivyx-tool = { path = "../aivyx-tool" }
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
# Phase 129 OAuth substrate lift — gmail's oauth/* modules
# are now thin re-export shims wrapping the shared crate.
aivyx-google-oauth = { path = "../aivyx-google-oauth" }
# Task 5 (2026-09-16 security audit fix) — reuses
# `enforce_secure_permissions` for config.toml's 0600
# tightening rather than reimplementing it. A pure leaf
# substrate crate (serde/toml/thiserror only), so this
# direction carries no cycle risk.
aivyx-auth-cli = { path = "../aivyx-auth-cli" }

# Async runtime — `process` not needed (we ARE the child process);
# `io-util` for read_frame/write_frame; `signal` is harmless.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "io-std", "fs"] }
async-trait = { workspace = true }

# HTTP + JSON — already workspace-wide via aivyx-llm. rustls-tls
# avoids OpenSSL; matches the rest of the workspace's TLS posture.
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

# Base64 for OAuth (PKCE) + MIME body encoding (Tasks 6/7).
# Already workspace-wide.
base64 = { workspace = true }

# TOML for the operator-supplied OAuth client config file at
# `~/.aivyx-pa/tool-processes/gmail/config.toml`. Version-pinned to
# match aivyx-config's existing `toml` dependency so the
# workspace stays version-coherent without yet promoting `toml`
# to a `[workspace.dependencies]` entry (deferred until enough
# crates need it to justify the workspace-deps surface change).
toml = "0.8"

# Uuid for OAuth `state` parameter (CSRF binding between the
# consent URL and the loopback callback). v4 — already workspace-
# wide.
uuid = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "fs"] }

# Excluded from `dist` releases — only the top-level `aivyx` binary is
# published as a release artifact. This tool-process binary ships with
# the daemon / is built from source, not as a standalone download.
[package.metadata.dist]
dist = false
