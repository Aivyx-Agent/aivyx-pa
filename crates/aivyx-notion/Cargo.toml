[package]
name = "aivyx-notion"
description = "Notion third-party tool process for Aivyx (Phase 130 — Chapter F #5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aivyx-notion"
path = "src/main.rs"

[dependencies]
aivyx-instance = { path = "../aivyx-instance" }
# Tool process SDK — consumes the lifted multi-tool harness
# from aivyx-tool::multi_harness (Phase 128 Task 2 lift).
aivyx-tool = { path = "../aivyx-tool" }
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
# Phase 132 substrate — shared auth_cli (BinaryMode,
# ConfigFileError, StatusReport, CheckReport, etc.).
aivyx-auth-cli = { path = "../aivyx-auth-cli" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "io-std", "fs"] }
async-trait = { workspace = true }

# HTTP + JSON — Notion's REST API. rustls-tls posture matches
# the rest of the workspace.
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }

# TOML for the operator-supplied config file at
# `~/.aivyx-pa/tool-processes/notion/config.toml` carrying the
# Notion Integration Token. No OAuth flow → no
# aivyx-google-oauth dep needed.
toml = "0.8"

thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "fs"] }

# Excluded from `dist` releases — only the top-level `aivyx` binary is
# published as a release artifact. This tool-process binary ships with
# the daemon / is built from source, not as a standalone download.
[package.metadata.dist]
dist = false
