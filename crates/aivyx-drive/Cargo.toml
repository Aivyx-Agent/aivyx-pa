[package]
name = "aivyx-drive"
description = "Google Drive third-party tool process for Aivyx (Phase 129 — Chapter F #3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aivyx-drive"
path = "src/main.rs"

[dependencies]
aivyx-instance = { path = "../aivyx-instance" }
# Tool process SDK — consumes the Phase 128 Task 2 lifted
# multi-tool harness directly. No in-tree harness copy.
aivyx-tool = { path = "../aivyx-tool" }
aivyx-core = { path = "../aivyx-core" }
aivyx-capability = { path = "../aivyx-capability" }
# Phase 129 Task 2 — Google OAuth substrate lift. Drive is
# the third Google integration; consumes the lifted crate
# directly from the start (no in-tree OAuth copy).
aivyx-google-oauth = { path = "../aivyx-google-oauth" }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "io-std", "fs"] }
async-trait = { workspace = true }

reqwest = { workspace = true, features = ["json", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }

base64 = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
thiserror = { workspace = true }

# Phase 157 — `futures_util::future::join_all`
# for the parallel level-BFS walk_folder_tree.
# Already a workspace dep via aivyx-calendar
# (Phase 151).
futures-util = { workspace = true }

# Phase 145 — drive.recent_files +
# drive.recent_changes compose `modifiedTime >
# '<RFC3339>'` query strings against an
# operator-supplied time window. chrono handles
# the window arithmetic + RFC 3339 serialization.
# Already a workspace dep; we just bring it into
# this crate.
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "fs"] }

# Excluded from `dist` releases — only the top-level `aivyx` binary is
# published as a release artifact. This tool-process binary ships with
# the daemon / is built from source, not as a standalone download.
[package.metadata.dist]
dist = false
