[package]
name = "aivyx-config"
description = "Configuration loading and validation for Aivyx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# Chapter Freight — validate `[pack] trusted_publishers` entries are
# base64 of 32-byte keys at load (strict-at-load house style).
base64 = { workspace = true }
# Error types for typed ConfigError variants. Matches the workspace's
# "every crate uses thiserror for its own error type" convention.
thiserror = { workspace = true }

# SecretString wrappers for api_key / telegram_token / passphrase.
# Secrets never land in a plain `String` field inside AivyxConfig; the
# whole crate's purpose is to hold them in `SecretString` so a stray
# `Debug` derive cannot leak them into a log.
secrecy = { workspace = true }

# Serde derive for the TOML schema (`RawConfigFile` mirror struct).
serde = { workspace = true }

# TOML parser. Pinned here because this is the only crate in the
# workspace that parses TOML — `toml = "0.8"` is the de-facto Rust
# TOML parser and uses `toml_edit` under the hood. Phase 9 Task 3 is
# the first task to introduce this dep; see the Task 3 ship record in
# PHASE_9.md for the "zero-new-dep streak broken, deliberately"
# rationale.
toml = "0.8"

# Chapter U — section-scoped, comment-preserving writes back to
# `aivyx.toml` (the `config_write` module). `toml`'s `to_string` would
# reflow the whole file and drop comments; `toml_edit` patches a single
# key in place. Same version the CLI's `aivyx access set` writer uses —
# Chapter U factors that writer into this shared module so the daemon and
# the CLI never diverge.
toml_edit = "0.22"

# Storage access for the encrypted-store fall-through. Phase 9 Task 3
# reads `KeyDomain::Secrets` to hydrate secret fields that env+TOML
# did not populate. The loader owns a shared `Arc<dyn Storage>` rather
# than a `&mut` reference so tests can hand in a mock cheaply.
aivyx-storage = { path = "../aivyx-storage" }

# Phase 13 Task 1 — per-role capability envelope fields. `Role` gains
# `capability_scopes: Sourced<Vec<Scope>>` and `trust_ceiling:
# Sourced<TrustTier>`, both of which need the real `Scope` / `TrustTier`
# types from `aivyx-capability`. Q2 resolution: parse scope strings at
# config-load time (not opaque-string-and-parse-later) so scope typos
# surface with TOML file+line context. `aivyx-capability` is a narrow
# leaf crate (two deps: serde + globset) so this is a one-way workspace
# edge — `aivyx-capability` does not and will not depend on
# `aivyx-config`.
aivyx-capability = { path = "../aivyx-capability" }

# Chapter K — `[pricing.<model>]` parses directly into the
# `aivyx_cost::ModelRate` serde struct (rate overrides for the cost report
# + the loop's dollar cap). `aivyx-cost` is a serde-only leaf crate, so this
# is a one-way edge (it does not depend on `aivyx-config`).
aivyx-cost = { path = "../aivyx-cost" }

# Phase 74 — `[[memory.retention]]` topic-glob validation. The
# globset crate is already in workspace as a transitive of
# aivyx-capability (Scope::matches uses it for capability-scope
# wildcards), so adding it here is not a net-new workspace dep.
globset = { workspace = true }

# Model routing Part 3a — `[routing]` parses directly into the shared
# `aivyx_route::RoutingConfig` serde struct, same "shared crate's type,
# parsed as-is" pattern as `aivyx-cost` above. `aivyx-llm` already
# depends on this crate; not a net-new workspace dep.
aivyx-route = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

# Tests that round-trip through a real encrypted store need crypto +
# storage to cold-open a redb file. We hand-roll the `$TMPDIR` RAII
# shim in `src/tests.rs` to match the workspace convention (see
# `aivyx-storage/Cargo.toml` dev-deps comment — no `tempfile` crate).
aivyx-crypto = { path = "../aivyx-crypto" }
