# Builds the native desktop app (`aivyx-desktop`) into installable bundles and
# attaches them to the GitHub Release. This is SEPARATE from the cargo-dist CLI
# release (`release.yml`): the desktop shell links a system webview, so it is
# gnu-linked (not musl-static like the `aivyx` CLI) and packaged with
# `cargo-bundle` (a `.deb` on Linux, a `.app`/`.dmg` on macOS). Each bundle
# also carries the `aivyx-pa` daemon the shell runs (First-run E).
#
# Exercised on the v0.7.0 release: the Linux `.deb` and macOS `.app` both build
# correctly on real runners. cargo-dist's `release.yml` is the sole release
# CREATOR; this workflow waits for that release to exist and then UPLOADS its
# bundles to it — never creates the release — so the two don't race on "create"
# (which is what broke the first v0.7.0 run).
#
# BOTH macOS targets build on the Apple-Silicon runner (`macos-14`): aarch64
# natively and x86_64 by cross-compiling with `--target` (the macOS SDK ships
# both slices). The old Intel runner (`macos-13`) is gone — GitHub is winding
# down hosted Intel macOS runners and they queued *indefinitely* in the public
# pool, so the x86_64 job never started and the whole run sat "queued" forever
# (v0.7.1–v0.7.3 each left the Intel `.zip` un-shipped). Cross-building keeps
# both architectures without depending on a runner that won't schedule.
# Windows is intentionally absent — it rides on the future daemon port.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # attach assets to the release

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (webview + tray + libxdo)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-bundle (retry on transient network failures, #13)
        run: |
          n=0
          until cargo install cargo-bundle --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "cargo install cargo-bundle failed after $n attempts"; exit 1
            fi
            echo "attempt $n hit a transient failure; retrying in 15s..."; sleep 15
          done
      - name: Bundle (.deb)
        working-directory: crates/aivyx-desktop
        run: cargo bundle --release --format deb
      # First-run E — the shell runs `aivyx-pa daemon run`, so the package
      # carries the daemon too (built here, on the same runner and glibc).
      - name: Add the aivyx-pa daemon to the .deb
        run: |
          cargo build --release -p aivyx-cli --bin aivyx-pa
          scripts/add-daemon-to-deb.sh target/release/bundle/deb/*.deb target/release/aivyx-pa
      # Attach to the release cargo-dist creates (release.yml) — wait for it to
      # exist first, then UPLOAD (never create), so we don't race cargo-dist's
      # "Create GitHub Release" step (it fails if the release already exists).
      - name: Attach .deb to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for cargo-dist to create release $GITHUB_REF_NAME… ($i)"
            sleep 20
          done
          # cargo-dist can swap its draft release for the published one right
          # after `view` first succeeds, so retry the upload itself too.
          for i in $(seq 1 15); do
            gh release upload "$GITHUB_REF_NAME" target/release/bundle/deb/*.deb --clobber && exit 0
            echo "upload attempt $i failed; retrying…"
            sleep 20
          done
          exit 1
      - name: Upload artifact (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivyx-desktop-linux-deb
          path: target/release/bundle/deb/*.deb

  macos:
    # Both slices build on the Apple-Silicon runner: aarch64 natively, x86_64
    # cross-compiled via `--target`. No Intel runner (it never schedules).
    runs-on: macos-14
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cargo-bundle (retry on transient network failures, #13)
        run: |
          n=0
          until cargo install cargo-bundle --locked; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "cargo install cargo-bundle failed after $n attempts"; exit 1
            fi
            echo "attempt $n hit a transient failure; retrying in 15s..."; sleep 15
          done
      - name: Bundle (.app)
        working-directory: crates/aivyx-desktop
        run: cargo bundle --release --format osx --target ${{ matrix.target }}
      # First-run E — the shell runs `aivyx-pa daemon run`: ship the daemon
      # inside the .app, beside the shell's own executable (which prefers it).
      - name: Add the aivyx-pa daemon to the .app
        run: |
          cargo build --release -p aivyx-cli --bin aivyx-pa --target ${{ matrix.target }}
          for app in target/${{ matrix.target }}/release/bundle/osx/*.app; do
            cp target/${{ matrix.target }}/release/aivyx-pa "$app/Contents/MacOS/aivyx-pa"
          done
      # A `.app` is a directory — zip it so it can be a single release asset.
      # With `--target`, cargo writes under `target/<triple>/release/…`.
      - name: Zip the .app
        run: |
          cd target/${{ matrix.target }}/release/bundle/osx
          zip -r -y "aivyx-desktop-${{ matrix.target }}.zip" *.app
      # Wait for the cargo-dist release, then upload (never create) — see the
      # Linux job for why.
      - name: Attach .app zip to the release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for cargo-dist to create release $GITHUB_REF_NAME… ($i)"
            sleep 20
          done
          # cargo-dist can swap its draft release for the published one right
          # after `view` first succeeds, so retry the upload itself too.
          for i in $(seq 1 15); do
            gh release upload "$GITHUB_REF_NAME" target/${{ matrix.target }}/release/bundle/osx/*.zip --clobber && exit 0
            echo "upload attempt $i failed; retrying…"
            sleep 20
          done
          exit 1
      - name: Upload artifact (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: aivyx-desktop-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/osx/*.zip
