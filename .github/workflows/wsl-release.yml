# Build the Aivyx PA WSL distribution and attach it to the GitHub Release.
#
# Fires on the version tag (like docker-publish.yml + desktop-release.yml),
# reuses the appliance image the Docker Publish workflow pushes for that tag as
# its base, and exports that image's root filesystem to a `.wsl` distribution
# tarball for Windows/WSL2 users. See docs/INSTALL.md "Windows" and
# Dockerfile.wsl.
#
# NOTE: we do NOT trigger on `release: published` — cargo-dist's release.yml
# publishes the release with GITHUB_TOKEN, and GitHub deliberately does not fire
# `release` events to other workflows when the actor is GITHUB_TOKEN (recursion
# guard). So, like desktop-release.yml, we run on the tag push and WAIT for both
# the base image and the cargo-dist release to exist, then UPLOAD (never create).
#
# Also `workflow_dispatch` so an existing tag can be back-filled.

name: WSL Distribution

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build + attach the .wsl artifact to (e.g. v0.7.37)"
        required: true

permissions:
  contents: write   # upload the .wsl asset to the release
  packages: read    # pull the appliance base image from GHCR

concurrency:
  group: wsl-release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-wsl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag + version
        id: v
        run: |
          set -eu
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ]; then echo "no tag resolved"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the appliance base image (retry while Docker Publish is in flight)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          ref="${IMAGE,,}:${VERSION}"   # GHCR requires a lowercase repo path
          # 90 attempts x 20s = 30 min, matching the "wait for cargo-dist's
          # release" loop below -- the previous 30-attempt/10-min budget was
          # shorter than Docker Publish's own real, historical 11-25 min
          # runtime, so this loop could (and did, for v0.9.1) exhaust its
          # retries and fail before the base image was ever actually ready.
          for i in $(seq 1 90); do
            if docker pull "$ref"; then
              echo "BASE_REF=$ref" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "base image $ref not ready yet (attempt $i/90) — waiting…"
            sleep 20
          done
          echo "base image $ref never appeared"; exit 1

      - name: Build the WSL image layer
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          docker build -f Dockerfile.wsl \
            --build-arg BASE="$BASE_REF" \
            -t "aivyx-wsl:${VERSION}" .

      - name: Export the root filesystem to a WSL distro tarball
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          cid="$(docker create "aivyx-wsl:${VERSION}")"
          # A `.wsl` file (WSL 2.4.4+) is a gzip-compressed rootfs tarball that
          # contains /etc/wsl-distribution.conf. The same file also imports with
          # the classic `wsl --import`.
          docker export "$cid" | gzip -9 > "Aivyx-PA.wsl"
          cp "Aivyx-PA.wsl" "aivyx-wsl-rootfs-x86_64-${VERSION}.tar.gz"
          docker rm "$cid" >/dev/null
          ls -lh Aivyx-PA.wsl "aivyx-wsl-rootfs-x86_64-${VERSION}.tar.gz"

      - name: Attach the artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          # cargo-dist (release.yml) is the sole release CREATOR and runs on the
          # same tag; wait for it to exist, then UPLOAD (never create) so we
          # don't race its "Create GitHub Release" step. Mirrors desktop-release.
          for i in $(seq 1 90); do
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            echo "waiting for cargo-dist to create release $TAG… ($i)"
            sleep 20
          done
          # cargo-dist can swap its draft release for the published one right
          # after `view` first succeeds, so retry the upload itself too.
          for i in $(seq 1 15); do
            gh release upload "$TAG" \
              "Aivyx-PA.wsl" \
              "aivyx-wsl-rootfs-x86_64-${VERSION}.tar.gz" \
              --clobber --repo "${{ github.repository }}" && exit 0
            echo "upload attempt $i failed; retrying…"
            sleep 20
          done
          exit 1
