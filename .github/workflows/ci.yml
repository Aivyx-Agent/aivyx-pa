# Phase 61 Task 4 — CI caller.
#
# Runs the shared quality-gate workflow on every push to main and
# every pull request. The same workflow gates the release pipeline
# (see `release.yml`'s `plan` job, wired via `plan-jobs` in
# `dist-workspace.toml`) so the rule is uniform: nothing ships
# without `cargo test --workspace` and `cargo clippy -- -D warnings`
# passing.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: catch new advisories and lints without a push
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
