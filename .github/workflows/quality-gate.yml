# Phase 61 Task 4 — Quality Gate (reusable workflow).
#
# Mirrors the local pre-commit hook discipline (the workspace has
# held at zero clippy warnings since the Phase 9 hook). Runs
# `cargo clippy --workspace --all-targets -- -D warnings` and
# `cargo test --workspace`. Consumed by two callers:
#
#   - `.github/workflows/ci.yml` — every push to main + every PR.
#   - `.github/workflows/release.yml` — wired in via the
#     `plan-jobs = ["./quality-gate"]` hook in
#     `dist-workspace.toml`. dist makes the plan job depend on
#     this workflow, which means NO release artifact gets built
#     unless `cargo test --workspace` and clippy both pass.
#
# Defense in depth: ci.yml catches failures at commit time;
# release.yml's wiring catches them at tag time even if the
# operator skipped the PR-time check.
#
# Phase 197 — also runs scripts/check-git-deps-public.sh before
# anything else: a private workspace git dependency silently broke
# every v0.9.0 release workflow (Phase 192) and would otherwise only
# surface ~10-20 minutes later, as an opaque cargo auth failure. See
# docs/archive/phases/PHASE_192.md and PHASE_197.md.

name: Quality Gate

on:
  workflow_call:

# Least privilege: reads the repository only (audit P13). A caller can grant
# less, never more, so release.yml's wider token doesn't reach this job.
permissions:
  contents: read

jobs:
  test-and-clippy:
    name: cargo test + clippy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Fails fast (a few seconds) and by name if a workspace git
      # dependency has silently become private — the exact failure
      # mode that broke every v0.9.0 release workflow (see
      # docs/archive/phases/PHASE_192.md). Deliberately placed before
      # the disk-cleanup/toolchain/cache steps below: those exist only
      # to support cargo test/clippy, which would fail anyway (just
      # 10-20 minutes later, via an opaque auth backtrace) if this
      # check would have failed.
      - name: Confirm git dependencies are anonymously cloneable
        run: ./scripts/check-git-deps-public.sh
      # `cargo test --workspace` builds every crate + every test/example binary
      # for 40 crates; combined with the restored dep cache it overflowed the
      # hosted runner's ~14 GB root disk ("No space left on device" mid-test,
      # which also manifested as truncated/again-missing logs). Reclaim ~20 GB of
      # preinstalled toolchains we never use before building. Dependency-free.
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules || true
          df -h /
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Swatinem/rust-cache caches only the reusable bits of `target`
      # (dependency artifacts), cleaning the final per-crate outputs +
      # test/example binaries it doesn't make sense to cache. The old
      # `actions/cache` over the *whole* `target` grew to ~9.6 GB and
      # overflowed the runner disk on restore ("No space left on device").
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        # aivyx-voice -> alsa-sys needs the ALSA dev library (alsa.pc) for
        # pkg-config. aivyx-desktop (tao / wry / tray-icon) needs the GTK3 +
        # WebKitGTK + appindicator + libxdo dev libs so the `--workspace`
        # clippy/test below can build it. (aivyx-web is wasm-only and handled
        # by the dedicated wasm step.) libpcsclite-dev + pkgconf are installed
        # ahead of time for aivyx-federation's optional, default-off
        # `yubikey` feature — its `pcsc-sys` build script needs them for
        # the dedicated `--features yubikey` steps below.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libpcsclite-dev \
            pkgconf
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      # Chapter Passport Task 7: aivyx-federation's hardware-backed (YubiKey)
      # `yubikey` feature, exercised separately from the default `--workspace`
      # steps above (which never touch it — `optional`, off by default,
      # confirmed via `cargo tree -p aivyx-federation` showing no
      # `aivyx-yubi`/`pcsc` edge with no flags passed). `aivyx-yubi` is a
      # `git` dependency (github.com/Aivyx-Agent/aivyx-yubi, pinned by commit
      # SHA in the root Cargo.toml), fetched automatically by Cargo — no
      # sibling checkout needed, unlike the `path`-dependency approach this
      # comment used to warn against before that repo had a real remote.
      # `libpcsclite-dev`/`pkgconf`, installed above, are what `pcsc-sys`
      # needs to build.
      - name: cargo clippy -p aivyx-federation --all-targets --features yubikey -- -D warnings
        run: cargo clippy -p aivyx-federation --all-targets --features yubikey -- -D warnings
      - name: cargo test -p aivyx-federation --features yubikey
        run: cargo test -p aivyx-federation --features yubikey
      # Chapter M — the aivyx-web Dioxus client must compile to wasm32 (it
      # speaks the daemon protocol through the shared aivyx-ipc types). The
      # steps above build it on the native target; this guards the real one.
      # The full `dx bundle` (→ crates/aivyx-web/dist/, embedded by the
      # daemon's build.rs) runs at release time, not here.
      - name: add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: aivyx-web builds + lints for wasm32
        run: |
          cargo build -p aivyx-web --target wasm32-unknown-unknown
          cargo clippy -p aivyx-web --target wasm32-unknown-unknown -- -D warnings
