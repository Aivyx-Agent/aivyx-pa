# Aivyx PA — worked example config (Phase 13 Task 3)
#
# This file is the canonical worked example for the per-role
# capability envelope shipped in PRODUCT.md P9 / Phase 13. Every
# concept that touches inheritance, attenuation, trust ceilings,
# and the backcompat floor shows up at least once. It is meant
# to be copied, edited, and used as a real config — not just
# read.
#
# The example also deliberately includes the **empty-child
# surprise** case (`junior_researcher` below) so operators see
# the floor-substitution behavior in a controlled setting
# instead of discovering it in production.
#
# ----------------------------------------------------------------
# Required top-level sections (minimal — no real secrets)
# ----------------------------------------------------------------
#
# A real deployment supplies `[anthropic] api_key`, `[fs] root`,
# `[storage] path`, `[aivyx_pa] passphrase`, etc. They are omitted
# here so the file can be loaded by tests via `LoadOptions`
# with `require_api_key = false`. Copy this file and add those
# fields before pointing a live binary at it.
#
# ----------------------------------------------------------------
# Schema for `[[role]]` entries (Phase 11 + Phase 13)
# ----------------------------------------------------------------
#
# Each `[[role]]` table-array entry adds one role to the
# `cfg.roles` map. Required key:
#
#   name = "<string>"        Role identifier. Must be unique.
#
# Phase 11 keys (legacy, still respected):
#
#   system_prompt        = "..."         Per-role prompt override
#   tool_allowlist       = ["fs.read"]   Which tool names may run
#   memory_topic_prefix  = "coder/"      Memory-topic namespace
#
# Phase 13 keys (new):
#
#   capability_scopes    = ["fs.read"]   Declared capability
#                                        envelope. The list of
#                                        scope strings the role
#                                        is allowed to *want*.
#                                        Parsed at config-load
#                                        time, so unknown bases
#                                        fail loudly with file
#                                        context.
#
#   trust_ceiling        = "Trusted"     Maximum trust tier this
#                                        role is allowed to run
#                                        at. Composes with the
#                                        channel's tier as a
#                                        second intersection
#                                        (the more-restrictive
#                                        of role / channel wins).
#                                        Valid values: Kernel,
#                                        Trusted, SemiTrusted,
#                                        Untrusted. Default:
#                                        Trusted.
#
#   parent_role          = "default"     Single-inheritance
#                                        parent. None = root.
#                                        Cycles + dangling
#                                        parents fail at load
#                                        time. A child's
#                                        declared scopes must
#                                        each be granted by some
#                                        scope on its nearest
#                                        constraining ancestor's
#                                        declared set (the
#                                        validator walks past
#                                        empty ancestors).
#
# Absent vs empty (the same rule that `tool_allowlist` already
# follows in Phase 11):
#
#   key absent           Treated as "Phase 13 has nothing to add."
#                        For `capability_scopes`: empty Vec, source
#                        = Default, and the *runtime* assembler
#                        substitutes the binary's hard-coded
#                        backcompat floor for that level.
#
#   key = []             Same as absent for `capability_scopes`.
#                        The validator skips empty levels when
#                        walking child→parent attenuation.
#
# Caveat: an *empty* `capability_scopes` is the unconstrained
# sentinel at config-load time, but at *runtime* it gets the
# backcompat floor injected per-empty-level. See the
# `junior_researcher` case below for what this means in
# practice.
#
# ----------------------------------------------------------------
# Worked roles
# ----------------------------------------------------------------

# `default` is the root of the inheritance forest. It declares
# the broadest envelope the operator wants any role in this
# config to be able to attenuate against. The unqualified
# scopes here let children declare *qualified* forms (e.g.
# `net.fetch:url-prefix:...`) and have them load cleanly under
# D4 Rule 2 (unqualified-held grants qualified-needed).
#
# Note `default` declares scopes that match the binary's
# backcompat floor in *shape* — but the floor uses a
# path-qualified `fs.read:<sandbox>/**` because the canonical
# sandbox path is only known at startup. Declaring `fs.read`
# unqualified here keeps the example file portable.
[[role]]
name = "default"
system_prompt = "You are Aivyx PA — a careful, deliberate AI agent."
# Phase 14 Task 2 adds unqualified `role.switch` to `default`'s
# declared envelope. Unqualified means "any target" under D4 Rule
# 2, and the root declaring it is what lets descendants (e.g.
# `coder` below) declare the qualified form `role.switch:<name>`
# and have it load cleanly through the assemble_role_envelope
# walker. A child declaring a qualifier the parent chain does not
# transitively grant would fail the config-load-time attenuation
# check, which is exactly the PRODUCT.md P1.3 "structurally
# impossible escalation" guarantee working.
capability_scopes = [
  "memory.read",
  "memory.write",
  "memory.forget",
  "fs.read",
  "fs.write",
  "net.fetch",
  "shell.exec",
  "role.switch",
]
trust_ceiling = "Trusted"

# `coder` inherits from `default` and *attenuates* it: drops
# `net.fetch` (a coder doesn't fetch URLs in this profile).
# Every declared scope is granted by `default`'s declared set
# (trivially, since each is the unqualified form), so the
# config-load-time attenuation walk passes.
#
# Effective runtime envelope (when activated):
#   coder_declared ∩ default_declared
#     = [memory.read, memory.write, memory.forget, fs.read,
#        fs.write, shell.exec]
#
# Trust ceiling intersection then folds in: `Trusted` keeps
# `shell.exec` (it is in CEILING_TRUSTED's set). The channel
# layer applies its own ceiling on top in the turn loop —
# `coder` on a SemiTrusted channel will lose `shell.exec` at
# dispatch time even though the role declared `Trusted`.
[[role]]
name = "coder"
system_prompt = "You are a pair-programmer. Reach for tests first."
# Phase 14 Task 2 adds `role.switch` to the allowlist so the
# `role.switch` tool is dispatch-layer-reachable. The allowlist
# gate and the capability gate are independent surfaces: an
# allowlist-only restriction would still need the role.switch
# capability scope below to pass the scope gate.
tool_allowlist = ["fs.read", "fs.write", "memory.read", "memory.write", "memory.forget", "shell.exec", "role.switch"]
memory_topic_prefix = "coder/"
# `role.switch:researcher` is a **qualified** switch grant — this
# coder can switch into the `researcher` role for sub-session
# work (per PRODUCT.md P1), but cannot switch into any other
# target (say, back into `default` or into `junior_researcher`).
# This qualified form is granted by `default`'s unqualified
# `role.switch` under D4 Rule 2, so the assemble_role_envelope
# walker lets it through at config-load time. After intersection
# with the parent chain, `coder`'s effective envelope holds
# `role.switch:researcher` (narrowed) rather than unqualified
# `role.switch` (widened) — the qualified form wins because
# intersection under D4 keeps the narrower scope.
capability_scopes = [
  "fs.read",
  "fs.write",
  "memory.read",
  "memory.write",
  "memory.forget",
  "shell.exec",
  "role.switch:researcher",
]
trust_ceiling = "Trusted"
parent_role = "default"

# `researcher` inherits from `default` and attenuates it
# differently: drops `fs.write` and `shell.exec`, narrows
# `net.fetch` to a single URL prefix. The qualified
# `net.fetch:url-prefix:https://httpbin.org/` is granted by
# `default.net.fetch` (unqualified) at config-load time via
# D4 Rule 2.
#
# Phase 33 adds `role.switch:junior_researcher` — the second
# link in the multi-level nesting chain. `coder` can switch
# into `researcher`, and now `researcher` can switch into
# `junior_researcher`. This demonstrates capability-bounded
# recursive nesting: each level can only narrow. The
# qualified form `role.switch:junior_researcher` is granted
# by `default`'s unqualified `role.switch` under D4 Rule 2.
#
# Trust ceiling note: `researcher` runs at `Trusted` here so
# the `fs.read` and `memory.forget` scopes survive the
# ceiling intersection — `CEILING_SEMITRUSTED` deliberately
# omits the *unqualified* `fs.read` / `fs.write` /
# `memory.forget` rows (they are "▲ rows" in the
# `aivyx-capability` ceiling table), so a SemiTrusted
# researcher would lose all three. A real deployment that
# wants a SemiTrusted researcher needs to declare
# *path-qualified* fs scopes (e.g. `fs.read:/notes/**`)
# rather than the unqualified base. That is a deliberate
# asymmetry in the capability layer: SemiTrusted forces
# qualifier discipline on filesystem access. The example
# stays at `Trusted` here so the "child attenuates parent
# scopes" teaching point isn't tangled up with the "ceiling
# strips unqualified bases" teaching point.
#
# Effective runtime envelope (when activated):
#   researcher_declared ∩ default_declared ∩ CEILING_TRUSTED
#     = [fs.read, memory.read, memory.write, memory.forget,
#        net.fetch:url-prefix:https://httpbin.org/,
#        role.switch:junior_researcher]
[[role]]
name = "researcher"
system_prompt = "You are a careful note-taker. Cite sources."
tool_allowlist = ["fs.read", "memory.read", "memory.write", "memory.forget", "web.fetch", "role.switch"]
memory_topic_prefix = "researcher/"
capability_scopes = [
  "fs.read",
  "memory.read",
  "memory.write",
  "memory.forget",
  "net.fetch:url-prefix:https://httpbin.org/",
  "role.switch:junior_researcher",
]
trust_ceiling = "Trusted"
parent_role = "default"

# `junior_researcher` is the **empty-child surprise** case.
#
# The operator's mental model: "junior_researcher inherits
# everything researcher has, but I haven't declared any of my
# own constraints, so it gets researcher's envelope verbatim."
#
# The *actual* runtime behavior under Phase 13's Q5
# resolution: an empty `capability_scopes` is the
# unconstrained sentinel at config-load time, and the runtime
# assembler substitutes the binary's **backcompat floor** for
# this level (NOT researcher's declared set). The walk then
# intersects the floor against researcher's envelope upward,
# with the path-qualified fs.read scope from the floor
# *narrowing* researcher's unqualified fs.read.
#
# Effective runtime envelope (when activated, on a Local
# channel where the floor includes `shell.exec`):
#   floor ∩ researcher_declared ∩ default_declared ∩ CEILING_TRUSTED
#
# Where `floor` is roughly:
#   [memory.read, memory.write, memory.forget,
#    fs.read:<sandbox>/**, fs.write:<sandbox>/**, net.fetch,
#    shell.exec]
#
# Working through the intersection (step 1 — `floor ∩
# researcher_declared`, which is where the surprise lives):
#   - memory.{read,write,forget}: kept (granted on both sides)
#   - fs.read:<sandbox>/** (from floor): granted by
#     researcher.fs.read (unqualified) via Rule 2, so it
#     survives in the path-qualified form
#   - researcher.fs.read (unqualified): NOT granted by
#     floor.fs.read:<sandbox>/** under Rule 4, so dropped
#     (the path-qualified form has *replaced* the
#     unqualified one)
#   - fs.write:<sandbox>/**: researcher has no fs.write at
#     all, so dropped
#   - floor.net.fetch (unqualified): NOT granted by
#     researcher.net.fetch:url-prefix:https://httpbin.org/
#     under Rule 4, so dropped
#   - researcher.net.fetch:url-prefix:https://httpbin.org/:
#     granted by floor.net.fetch via Rule 2, kept
#   - shell.exec: researcher has no shell.exec, dropped
#
# Step 2: intersect with `default_declared`. Default's
# unqualified `fs.read` grants the path-qualified form
# (Rule 2), and the rest carry through unchanged.
#
# Step 3: intersect with `CEILING_TRUSTED`. CEILING_TRUSTED
# is broad — it includes `fs.read`, `memory.forget`, and
# `net.fetch` as unqualified bases, all of which grant the
# qualified forms in our running set. Everything survives.
#
# Final junior_researcher envelope:
#   [memory.read, memory.write, memory.forget,
#    fs.read:<sandbox>/**,
#    net.fetch:url-prefix:https://httpbin.org/]
#
# Compare to `researcher`'s envelope, which is:
#   [memory.read, memory.write, memory.forget,
#    fs.read,                                       <-- unqualified
#    net.fetch:url-prefix:https://httpbin.org/]
#
# **The two roles produce different envelopes** even though
# `junior_researcher` declared an empty `capability_scopes`
# and an operator's mental model would expect them
# identical. `researcher` keeps an unqualified `fs.read`
# (and so could read any path under its tier ceiling);
# `junior_researcher` is silently narrowed to `fs.read`
# under the binary's startup-canonicalized sandbox path —
# because the *floor*, not `researcher`'s declared set, is
# what got substituted in for the empty level.
#
# The fix, if you want junior_researcher to inherit
# researcher's declared envelope verbatim: declare scopes on
# junior_researcher explicitly. The implicit-floor path is
# exactly **one level deep** — no transitive inheritance
# through empty ancestors. Phase 13 Task 2's correction
# block in `docs/PHASE_13.md` records this design
# constraint with rationale.
[[role]]
name = "junior_researcher"
system_prompt = "You are a junior researcher. Ask for help when uncertain."
tool_allowlist = ["fs.read", "memory.read", "memory.write", "memory.forget", "web.fetch"]
memory_topic_prefix = "junior_researcher/"
capability_scopes = []
trust_ceiling = "Trusted"
parent_role = "researcher"

# ----------------------------------------------------------------
# Provider selection (Phase 25)
# ----------------------------------------------------------------
#
# `[agent] provider` selects the LLM backend. Default: "anthropic".
# Supported values: "anthropic", "openai", "ollama".
#
# - "openai" targets cloud OpenAI or any compatible endpoint.
# - "ollama" is sugar for local Ollama — defaults to
#   http://localhost:11434, API key is optional, and
#   stream_options.include_usage is omitted (some Ollama
#   versions reject unknown fields).
#
# Can also be overridden via `AIVYX_PA_PROVIDER` env var or
# `--provider` CLI flag.
#
# See `examples/aivyx-ollama.toml` for a complete local LLM
# worked example.
#
# [agent]
# provider = "openai"
#
# [openai]
# api_key = "sk-..."
# base_url = "https://api.openai.com"  # default for "openai"

# ----------------------------------------------------------------
# Agent personal workspace (Chapter O)
# ----------------------------------------------------------------
#
# The agent's OWN space — separate from `[fs] root` (the operator's
# files, governed by `[access]`) and from memory (recall facts). A
# real directory the agent owns for its thoughts, ideas, plans, and
# projects, reached by the `workspace.*` tools. Always available
# regardless of the access level (even a sandboxed agent gets one),
# and inspectable by the operator with `aivyx-pa workspace ls / cat`.
#
# Defaults (no `[workspace]` section): enabled, at `~/.aivyx-pa/workspace`,
# with proactive journaling on every 6h. Set `enabled = false` to turn
# the whole subsystem off.
#
# [workspace]
# enabled = true
# path = "~/.aivyx-pa/workspace"     # override the default location
#
# [workspace.journaling]
# # Proactive journaling: every `interval_secs`, if there has been
# # recent activity, the agent reflects and appends to its journal on
# # its own. Bounded — one fire per interval, nothing on an idle window.
# enabled = true
# interval_secs = 21600           # 6 hours

# ----------------------------------------------------------------
# MCP server entries (Phase 24)
# ----------------------------------------------------------------
#
# Each `[[mcp_server]]` entry declares an MCP server that the
# daemon starts at boot and whose tools become available to agents.
# Required keys: `name` (server identifier, used in scope
# qualifiers as `mcp.call:<name>:<tool>`), `command` (executable).
# Optional: `args` (argument list, default []), `enabled` (default
# true — set false to keep the entry but skip startup).
#
# Uncomment to enable:
#
# [[mcp_server]]
# name = "github"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
#
# [[mcp_server]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# ----------------------------------------------------------------
# Notification targets (Phase 62 — Reach Milestone)
# ----------------------------------------------------------------
#
# Each `[[notify_target]]` entry declares an outbound notification
# destination the agent can push to via the `notify.send` tool.
# Four kinds:
#
#   kind = "telegram"  — uses the operator's existing bot (the
#                        same [telegram] token below) to send a
#                        message to the configured `chat_id`.
#                        Multiple Telegram targets share one bot
#                        token; each just names a different chat.
#
#   kind = "webhook"   — HTTP POST with a JSON body
#                        {source, target, subject?, message,
#                        timestamp} to the configured `url`.
#                        Suitable for ntfy.sh, Pushover, IFTTT,
#                        Slack incoming webhooks (with caveat),
#                        and custom endpoints. 5-second timeout.
#
#   kind = "email"     — Phase 68 SMTP email backend; shares
#                        the [email] block below across all
#                        email targets.
#
#   kind = "web-ui"    — Phase 69 Web UI desktop notification.
#                        Requires the Web UI server enabled
#                        below; fans out via OS-level browser
#                        Notification API + in-page toast.
#
# Required keys per kind:
#   - telegram: `name`, `kind = "telegram"`, `chat_id` (string)
#   - webhook:  `name`, `kind = "webhook"`, `url`
#                (must start with http:// or https://)
#   - email:    `name`, `kind = "email"`, `to` (recipient
#                address) — also requires the [email] block.
#   - web-ui:   `name`, `kind = "web-ui"` (no other fields)
#
# Optional: `enabled` (default true — set false to keep the
# entry but skip dispatcher registration).
#
# Capability gating: the `notify.send` scope is in CEILING_TRUSTED
# only. A role can attenuate to a specific target by declaring
# `notify.send:<name>` in `capability_scopes`; the unqualified
# `notify.send` grants any configured target.
#
# Uncomment to enable. Replace placeholder values with real ones.
#
# [[notify_target]]
# name = "phone"
# kind = "telegram"
# chat_id = "123456789"   # your Telegram chat_id (positive for DMs,
#                         # negative for groups, e.g. -1001234567890)
#
# [[notify_target]]
# name = "ops-alerts"
# kind = "webhook"
# url = "https://ntfy.sh/aivyx-personal-2026"
#
# Phase 68 — email notify_target.
#
# Requires the [email] block below for the shared SMTP
# credentials. Each email target carries just the recipient;
# multiple targets share one [email] account.
#
# Provider notes:
#   - Gmail: SMTP host smtp.gmail.com, port 587 (STARTTLS).
#     Use an "app password" — Google requires it for SMTP
#     access when 2FA is enabled. Account settings →
#     Security → App passwords.
#   - Fastmail: SMTP host smtp.fastmail.com, port 587.
#     App password from Settings → Privacy & Security.
#   - ProtonMail: requires the ProtonMail Bridge running
#     locally (the bridge exposes SMTP on 127.0.0.1).
#   - Self-hosted Postfix / AWS SES / etc.: whatever your
#     provider documents for SMTP submission.
#
# [[notify_target]]
# name = "my-inbox"
# kind = "email"
# to = "you@example.com"
#
# [email]
# host = "smtp.fastmail.com"
# port = 587                            # default; can omit
# tls_mode = "starttls"                 # default; "implicit" → 465
# username = "you@example.com"
# password = "<app-password>"           # SMTP / app password
# from = "aivyx@example.com"
#
# Phase 69 — Web UI desktop notification.
#
# Sends an OS-level browser notification + an in-page toast
# banner to every connected Web UI browser tab. Requires the
# `[daemon] web_ui = true` (or a `web_ui_port`) below so the
# Web UI server is running. No credentials, no addresses —
# operators just grant the browser notification permission
# once when the page first loads.
#
# Pair this with `kind = "email"` or `kind = "telegram"` for
# persistence: Web UI notifications fire only while a browser
# tab is open and require the operator to be at the laptop.
#
# [[notify_target]]
# name = "desktop"
# kind = "web-ui"
#
# Example: granting the `coder` role permission to notify the
# `phone` target only (no access to `ops-alerts`):
#
#   [[role]]
#   name = "coder"
#   capability_scopes = [
#     # ... other scopes ...
#     "notify.send:phone",
#   ]
#   tool_allowlist = ["notify.send", ...]

# ----------------------------------------------------------------
# Auto-notify on trigger fire (Phase 63 — Reach Phase 2)
# ----------------------------------------------------------------
#
# `[[schedule]]`, `[[webhook]]`, and `[[file_watch]]` entries
# each accept an optional `notify_target = "..."` field. When
# set, the daemon auto-dispatches the trigger-fired turn's final
# response to the named target after the turn completes — no
# agent involvement, no system-prompt instruction needed. The
# subject is auto-generated as `<kind>: <trigger-name>`
# (e.g. `cron: morning-summary`).
#
# Capability gate: the trigger's role must have `notify.send`
# (qualified to the target, or unqualified) in its effective
# envelope. The config loader validates this at startup; a
# mismatch produces a load-time error naming both the role and
# the target rather than silently failing at 9am the next
# morning.
#
# Failure behavior: one attempt per fire. Dispatch failures are
# logged via stderr; the trigger itself is unaffected (a
# scheduled summary that did its work successfully isn't marked
# Failed just because Telegram was unreachable).
#
# Special outcomes:
# - Empty agent response → skip the dispatch (no point sending
#   an empty notification).
# - Failed turn → notification body is "Turn failed: <reason>"
#   so the operator knows their job blew up.
# - Escalated turn → "Turn escalated: <reason>".
#
# Uncomment to enable. Requires:
#  1. A matching [[notify_target]] entry above.
#  2. The trigger's role (default if unspecified) declaring
#     `notify.send` in capability_scopes.
#
# [[schedule]]
# name = "morning-summary"
# cron = "0 0 9 * * * *"   # 9:00 AM daily
# prompt = "Summarize my day's calendar, unread mail, and open issues. Reply with the summary."
# notify_target = "phone"
# wrap_mission = false

# ----------------------------------------------------------------
# Phase 72 — multi-target fan-out, default-target, conditional gate
# ----------------------------------------------------------------
#
# Three operator-feedback knobs land here:
#
# 1. `notify_targets = ["phone", "desktop"]` on a trigger fires
#    every named target concurrently. One target's transport
#    failure doesn't block the others; each per-target outcome
#    audits independently. The singular `notify_target = "phone"`
#    stays valid as a one-element alias for backwards
#    compatibility. Declaring both forms on the same trigger
#    rejects at config-load time.
#
# 2. `default = true` on ONE `[[notify_target]]` block marks it
#    as the global default. Triggers that omit `notify_targets`
#    fall through to the default at config-load time. At most
#    one default is allowed; multiple defaults reject.
#
# 3. `notify_when` on a trigger gates dispatch by turn outcome:
#      "always"               — today's behavior (default)
#      "on_failed"            — only ping on Failed | TimedOut
#      "on_completed_non_empty" — skip empty + non-completed
#                                  outcomes
#    A gate-skipped dispatch records
#    `SkippedByCondition { condition }` in the audit chain.
#
# Example — fire a daily summary to multiple targets but only
# ping the operator when the agent has something to say:
#
# [[notify_target]]
# name = "phone"
# kind = "telegram"
# chat_id = "123456789"
# default = true
#
# [[notify_target]]
# name = "desktop"
# kind = "web-ui"
#
# [[schedule]]
# name = "morning-summary"
# cron = "0 0 9 * * * *"
# prompt = "Summarize my day. Reply only with what's actionable."
# notify_targets = ["phone", "desktop"]
# notify_when = "on_completed_non_empty"

# ----------------------------------------------------------------
# Phase 73 — per-target retry + rate-limit knobs
# ----------------------------------------------------------------
#
# Each `[[notify_target]]` block accepts four optional fields that
# tune backend behavior:
#
#   retry_count             u32, default 0, capped at 10
#   retry_backoff_ms_start  u64, default 500ms, minimum 100ms
#   rate_limit_max          u32 (must pair with window_secs)
#   rate_limit_window_secs  u64 (must pair with max)
#
# Retry behavior: on Transport / Timeout / Rejected with HTTP
# status ≥ 500, the daemon sleeps for `backoff * 2^attempt` and
# retries up to `retry_count` additional times. Auth, UnknownTarget,
# and Rejected with status < 500 are NOT retried — those need
# operator intervention or are programmer errors. retry_count = 0
# (the default) preserves Phase 62 behavior of one attempt per
# fire.
#
# Rate limit: an in-memory sliding-window token bucket per target.
# When set, the daemon admits at most `rate_limit_max` dispatch
# attempts per `rate_limit_window_secs` for the target. Excess
# attempts skip the backend call and record
# `AutoNotifyOutcomeSummary::SkippedByRateLimit` in the audit
# chain (visible in `aivyx-pa notify history` and the Web UI
# Notifications pane). Both fields must be set together or
# neither — partial config rejects at load time. State lives in
# memory for the daemon's lifetime; daemon restart resets the
# bucket.
#
# Example — aggressive retry on a flaky webhook + a modest hourly
# cap on Telegram so a runaway loop can't flood the operator's
# phone:
#
# [[notify_target]]
# name = "alerts"
# kind = "webhook"
# url = "https://ntfy.sh/aivyx-personal-2026"
# retry_count = 5
# retry_backoff_ms_start = 200
#
# [[notify_target]]
# name = "phone"
# kind = "telegram"
# chat_id = "123456789"
# rate_limit_max = 20
# rate_limit_window_secs = 3600

# ----------------------------------------------------------------
# Reflection auto-loop (Phase 70 — P14 self-learning closure)
# ----------------------------------------------------------------
#
# A `[[reflection_schedule]]` block declares when the agent
# should run a *reflection turn* — a turn focused on examining
# recent behavior and proposing Persona deltas (P14) that
# refine how the assistant communicates, prefers, and avoids.
# Each proposed delta is queued as a Pending row in the encrypted
# proposal store; the operator reviews via the new Web UI
# Proposals pane or `aivyx-pa persona proposals` CLI.
#
# Why a dedicated section instead of reusing `[[schedule]]`?
# Per Q1(a) at Phase 70 sign-off: the reflection-turn semantics
# (canonical reflection prompt, outcome-summary input context,
# persistent proposal store) differ enough that operator
# clarity wins over composability.
#
# Required keys:
#   - `name`  — unique across `[[reflection_schedule]]` AND
#               `[[schedule]]` entries (single namespace).
#   - `cron`  — standard 6-field cron pattern.
#
# Optional keys (with defaults):
#   - `lookback_window_secs` — how far back to summarize turn
#       outcomes when running the reflection. Default 86400
#       (24 hours). Bounded to [60, 30 days].
#   - `role_override` — fire the reflection turn under a
#       specific role instead of the default. The named role
#       must exist in this config.
#   - `enabled` — `true` by default; `false` keeps the entry
#       in the config but skips scheduler registration.
#
# Phase 71 closes the loop: when this section is configured
# AND the daemon has an audit log open (the default for any
# normal `aivyx-pa daemon run`), the daemon spawns a scheduler
# task that fires reflection turns on each entry's cron
# pattern. The reflection turn carries a canonical reflection
# system prompt (conservative phrasing: propose only when a
# pattern recurs ≥3 times) plus the last `lookback_window_secs`
# of TurnStarted/TurnEnded outcome summaries from the audit
# chain. Any persona deltas the agent proposes via
# `reflection.propose` land as Pending rows in the persona
# proposal chain for asynchronous operator review via the
# Web UI Proposals pane or `aivyx-pa persona proposals` CLI.
#
# [[reflection_schedule]]
# name = "nightly-reflection"
# cron = "0 0 23 * * *"            # 11pm daily
# lookback_window_secs = 86400     # last 24 hours
# # role_override = "reflective"   # optional
#
# Phase 95 — cadence learning (skip-when-idle). Opt in
# per-schedule. When `skip_when_idle = true`, the scheduler
# reads the audit-chain growth since the last *fired* cycle;
# if growth is below `min_audit_entries_to_fire`, the cycle
# is skipped entirely (no LLM cost). The cron remains the
# upper bound on firing rate — this is monotonic-slower-only,
# never faster.
#
# Two example shapes:
#
# # Idle-friendly daily schedule: only reflect when the day
# # produced real activity. Saves LLM cost on quiet days /
# # vacations / weekends.
# [[reflection_schedule]]
# name = "daily-when-busy"
# cron = "0 0 23 * * *"
# lookback_window_secs = 86400
# skip_when_idle = true             # optional, default false
# min_audit_entries_to_fire = 100   # optional, default 1
#
# # Hourly responsive schedule: low threshold so the cron
# # fires whenever there's been *any* recent activity but
# # silently skips dead hours overnight.
# [[reflection_schedule]]
# name = "hourly-touch"
# cron = "0 0 * * * *"
# lookback_window_secs = 3600
# skip_when_idle = true
# min_audit_entries_to_fire = 5
#
# To SEE it: daemon log `aivyx-pa reflection: schedule "X" —
# skipped (audit-growth K below threshold M)` each skipped
# cycle; `aivyx-pa learning` / Web UI "Learning" tab show a
# "Reflection cadence (Phase 95)" block with per-schedule
# `K fired, S skipped` counts. Schedules without cadence
# decisions are omitted from the block.

# ----------------------------------------------------------------
# Memory polish (Phase 74) — search, retention, LRU
# ----------------------------------------------------------------
#
# The memory substrate (topic/body store the agent writes via
# memory.write) gained three operator knobs in Phase 74:
#
# 1. Keyword search. The agent gets a `memory.search` tool
#    (case-insensitive substring across topics + bodies);
#    operators get `aivyx-pa memory search <query>` + the Web UI
#    Memory pane's search bar. No config — it's always
#    available to any role holding the cross-topic
#    `memory.read:topic:*` wildcard scope.
#
# 2. Per-topic retention. `[[memory.retention]]` blocks declare
#    a topic-glob pattern + a policy. The hourly GC pass walks
#    every entry, applies the FIRST matching rule, and falls
#    through to the global TTL (`[memory] ttl_secs`) for
#    unmatched topics. Put narrower globs first.
#
#    Each block sets exactly ONE of:
#      retention = "forever"   — never TTL-expire
#      retention_days = N      — evict entries older than N days
#
# 3. LRU eviction. When a topic exceeds `[memory] max_per_topic`
#    the least-recently-READ entry is evicted first (every
#    memory.read stamps last_read_at). No config knob — it's
#    automatic once max_per_topic is set.
#
# Example — keep project notes forever, expire scratch daily
# notes after 30 days, expire everything else after the global
# TTL:
#
# [memory]
# max_per_topic = 200
# ttl_secs = 7776000          # 90 days global fallback
#
# [[memory.retention]]
# topic_glob = "project/**"
# retention = "forever"
#
# [[memory.retention]]
# topic_glob = "notes/daily/*"
# retention_days = 30

# ----------------------------------------------------------------
# Topic canonicalization (Phase 89) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# For 88 phases every topic-keyed accumulator (memory, recall
# log, helpfulness ledger, co-occurrence ledger, Persona
# consolidate-pair provenance) keyed by the operator's typed
# topic VERBATIM — so `deploy`, `Deploy`, `deploys`, and
# `deploying` were four distinct topics across every signal,
# and the value that should add up across them was silently
# fragmented.
#
# Phase 89 fixes this with the smallest possible substrate
# change: an opt-in canonicalization seam at the Memory
# trait's topic-string boundary. With the flag on, every
# topic argument is lowercased + trimmed + stemmed (`ies → y`,
# `ing` / `ed` / hissing-`es` / `s` drop, with min-length +
# `ss` / non-hissing guards) before storage; lookups fold the
# same way; every downstream consumer inherits the canonical
# form through the existing pipeline.
#
# Off by default: with no `canonicalize_topics` key (or set
# to `false`) the memory layer is byte-identical to
# pre-Phase-89. No migration: existing fragmented signal
# decays out via the Phase 82/83 ~60-day half-life + Phase 77
# ~30-day recall-log retention (~quarter to converge).
#
# [memory]
# canonicalize_topics = true   # optional, default false
#
# Trade-off: the stemmer lowercases proper-noun-looking
# topics too (`Deploy` → `deploy`). Slugs in this codebase
# are category labels (`auth`, `frontend`, `tests`), so the
# trade is positive in practice. Operator-tunable aliases
# (`[[topic_alias]]`) + a topic-by-topic exception list are
# deferred follow-ups.

# ----------------------------------------------------------------
# Smart memory — one switch (Chapter Synapse): [memory] profile
# ----------------------------------------------------------------
#
# The memory stack below (graph-augmented recall + the knowledge-wiki
# and typed-knowledge-graph layers + their extraction sweeps) is rich
# but, by default, all OFF and spread across ~14 knobs. To turn on the
# whole coherent stack with ONE line:
#
#   [memory]
#   profile = "smart"      # off (default) | lite | smart
#
# Three tiers:
#   off    today's behavior, byte-identical.
#   lite   recall fusion over data you ALREADY have — hybrid (BM25) +
#          co-occurrence siblings/walk. No LLM generation, no extra cost.
#          "Make recall smarter for free."
#   smart  lite PLUS the wiki + typed-graph layers and their [wiki]/[graph]
#          extraction sweeps (those cost LLM calls) and their recall
#          weights — the full self-organizing stack.
#
# All tiers need an `[embedding]` section for the semantic-recall parts.
# Any knob you set explicitly below still wins — `profile` is a floor, not
# a cage. Leave it `off` (or unset) for exactly today's behavior.
#
# ----------------------------------------------------------------
# Semantic memory search (Phase 75) — optional `[embedding]`
# ----------------------------------------------------------------
#
# Without this section `memory.search` is keyword-only (exactly
# the pre-Phase-75 behavior) and `mode = "semantic"` requests
# transparently fall back to keyword. Add `[embedding]` to turn
# on embedding-ranked retrieval:
#
#   - `memory.write` embeds each new entry's body at write time
#     (non-fatal — a provider hiccup just defers the vector to
#     the hourly backfill; the entry is still written and
#     keyword-findable).
#   - An hourly backfill re-embeds anything missing a vector, so
#     enabling this on an existing store gradually indexes the
#     whole back-catalog (bounded per tick — no startup stall).
#   - `aivyx-pa memory search <q> --semantic`, the agent's
#     `memory.search` `mode` arg, and the Web UI "semantic"
#     toggle all use it.
#
# PRIVACY — read this. `base_url` is the only thing that decides
# whether memory content leaves the machine. Embedding requires
# sending the text to be embedded to the configured endpoint:
#
#   • Cloud (text leaves the box — your explicit choice):
#       [embedding]
#       base_url = "https://api.openai.com"
#       model = "text-embedding-3-small"
#       api_key = "sk-..."          # or AIVYX_PA_EMBEDDING_API_KEY,
#                                   # or the encrypted secrets store
#       dimensions = 1536
#
#   • Local / on-device (nothing leaves the box) — point at any
#     OpenAI-compatible server (ollama, llama.cpp,
#     text-embeddings-inference). No api_key needed:
#       [embedding]
#       base_url = "http://localhost:11434"
#       model = "nomic-embed-text"
#       dimensions = 768
#
# `dimensions` must match the model's native output. If you swap
# models later, stored vectors of the old dimension are treated
# as unembedded and the backfill re-embeds them automatically.
#
# Defaults if a field is omitted (but the section is present):
#   base_url   = "https://api.openai.com"
#   model      = "text-embedding-3-small"
#   dimensions = 1536
# api_key resolves env (AIVYX_PA_EMBEDDING_API_KEY) > this TOML key
# > the encrypted secrets store — same precedence as the
# anthropic / openai keys.
#
# ----------------------------------------------------------------
# Automatic recall (Phase 76) — `rag_top_k` / `rag_min_similarity`
# ----------------------------------------------------------------
#
# With `[embedding]` configured, the assistant doesn't only
# recall when it calls `memory.search` — every turn it embeds
# your message and silently injects the most relevant past
# memories into that turn's context (a clearly-labeled,
# reference-only block; the daemon log prints
# `aivyx-pa recall: injected N memories [...]` when it fires). No
# embedding configured → no auto-recall, exactly as before.
#
# Two knobs tune it (both optional, shown with their defaults):
#
#   [embedding]
#   # ... base_url / model / api_key / dimensions as above ...
#   rag_top_k = 5             # max memories injected per turn
#   rag_min_similarity = 0.20 # drop hits below this cosine score
#   recall_window_turns = 1   # conversational-window relevance (Phase 86)
#   recall_gate_min_chars = 0 # heuristic recall gate (Phase 90)
#   ann_index = false         # ANN-index opt-in (Phase 96)
#   ann_rebuild_threshold = 100   # ANN stale-rebuild threshold (Phase 96)
#   recall_token_budget = 0   # token-budget context sizing (Phase 97)
#   recall_hybrid = false     # hybrid keyword+semantic fusion (Phase 98)
#   # Chapter Loom — graph-augmented recall (only when recall_hybrid = true).
#   # Recall fuses three signals on one ranking via weighted RRF:
#   recall_lexical_weight = 1.0   # weight of the BM25 lexical ranker
#   recall_graph_hops    = 0      # 0 = graph source off; >=1 = walk the
#                                 #   co-occurrence graph N hops as a 3rd ranker
#   recall_graph_decay   = 0.5    # per-hop affinity decay for the walk
#   recall_graph_weight  = 1.0    # weight of the graph ranker
#   # Chapter Codex — fuse a topic's consolidated wiki-page summary as a
#   # single high-signal recall unit (needs [wiki] pages synthesized):
#   recall_wiki_weight   = 0.0    # 0 = off; >0 arms the wiki ranker
#
# `rag_min_similarity` is the important one: it is the floor that
# stops an unrelated prompt from dragging in weakly-related
# noise. Raise it (e.g. 0.35) for stricter, fewer injections;
# lower it (e.g. 0.10) to recall more aggressively. Valid range
# is [0.0, 1.0]; `rag_top_k` must be >= 1.
#
# ----------------------------------------------------------------
# Conversational-window relevance (Phase 86) — recall_window_turns
# ----------------------------------------------------------------
#
# For 85 phases auto-recall (Phase 76) and adaptive Persona
# selection (Phase 79) embedded only your LATEST message — a
# lossy proxy for multi-turn intent. Phase 86 lets the
# relevance ranker see the last few turns by concatenating
# them into the same single embed it already makes (current
# message last, so it dominates).
#
# Opt-in, byte-identical by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity above ...
#   recall_window_turns = 3   # default 1 = pre-Phase-86 single line
#
# Set 1 to keep exactly today's behaviour. Raise it (2–5 is
# typical) to let recall + Persona selection consider recent
# context. The window is capped at 16 turns regardless; the
# `rag_min_similarity` / Persona-selection floors still filter
# weakly-related hits, so a drifted window never drags in
# noise. The window itself is ephemeral (daemon-memory only;
# a restart starts fresh). Validation when `[embedding]` is
# present: `recall_window_turns >= 1`.
#
# ----------------------------------------------------------------
# Heuristic recall gate (Phase 90) — recall_gate_min_chars
# ----------------------------------------------------------------
#
# For 89 phases auto-recall and adaptive Persona selection
# fired on EVERY turn, including single-token acknowledgments
# (`ok` / `thanks` / `yes` / `cool`) where the bare-message
# embed is essentially a random vector that pollutes the
# ranker. Phase 90 adds a length-based gate: when the trimmed
# user message is SHORTER than `recall_gate_min_chars`
# Unicode characters, both relevance hooks short-circuit
# before any embed call (recall returns None, the Persona
# refiner falls through to the full base prompt).
#
# Opt-in, off by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity / recall_window_turns ...
#   recall_gate_min_chars = 4   # default 0 = disabled
#
# Set 0 (default) to keep today's behaviour. Raise to gate
# noise turns; 4 is a conservative starting point that gates
# `ok` / `yes` / `cool` without touching normal messages.
# Counted in UNICODE characters, not bytes (`héllo` is 5
# chars whether or not it's 6 UTF-8 bytes). Trade-off: short
# but meaningful messages (`run!`, `ack`, `git`) gate
# alongside fillers — keep the threshold conservative if
# you use them.
#
# ----------------------------------------------------------------
# ANN index (Phase 96) — ann_index / ann_rebuild_threshold
# ----------------------------------------------------------------
#
# Semantic memory search is brute-force cosine by default:
# every query compares against every stored vector. That's
# O(N) per query and is fine for any operator with up to a
# few thousand entries. Phase 96 adds opt-in IVF-style
# approximate-nearest-neighbor indexing for larger stores.
#
# How it works: vectors partition into K ≈ √N clusters at
# build time; queries cosine-rank the K centroids, pick the
# top-N clusters, and brute-force within those. The
# existing brute-force re-rank then orders the final top-K
# exactly within the candidate set (ANN narrows → brute
# re-ranks; the hybrid composition preserves the exact-
# cosine guarantee). End-to-end: O(N) → O(√N).
#
# Opt-in, off by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity / recall_window_turns ...
#   ann_index = true                # default false
#   ann_rebuild_threshold = 100     # default 100
#
# `ann_index = false` (the default): brute-force only,
# byte-identical to pre-Phase-96. `ann_index = true`:
# ANN narrows → brute-force re-ranks within. The
# `ann_rebuild_threshold` is the number of new vector
# writes after the last build before the index is marked
# stale and the next recall rebuilds. Lower for tighter
# freshness; raise for fewer rebuilds.
#
# Trade-off: the IVF approach trades some recall for
# simplicity + zero new workspace dependencies. For very
# large stores (>100K entries) where recall quality
# matters more, HNSW-level indexing is a future
# phase. Validation: `ann_rebuild_threshold >= 1` when
# `ann_index = true`.
#
# To turn it off: delete the key or set `ann_index = false`.
# Daemon restart drops the in-memory index; the first ANN
# query after restart rebuilds from the persisted
# embeddings (no startup stall — the rebuild is on the
# first query, not on boot).
#
# ----------------------------------------------------------------
# Token-budget context sizing (Phase 97) — recall_token_budget
# ----------------------------------------------------------------
#
# Auto-recall (`rag_top_k`) and adaptive Persona selection
# (internal K-facet cap) both cap injection by ENTRY
# COUNT. Count is a proxy for token cost, not the cost
# itself. A 4 KB memory body silently displaces several
# shorter memories from the same `rag_top_k` budget; a
# Persona facet that grew from a sentence to ten
# paragraphs eats turn after turn of input — sometimes
# enough to bump the prompt past the model's context limit.
#
# Phase 97 adds an opt-in token budget that caps both
# paths AFTER their existing rank-and-filter steps. The
# count caps remain in place as soft hints; the token
# budget is the hard cap. Items are already in rank order
# (cosine score for recall, selection priority for
# Persona); the budget walks them and drops the first
# over-budget item along with every item after it. No
# mid-item truncation — full items or nothing.
#
# Opt-in, off by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity / ... ...
#   recall_token_budget = 2000   # default 0 = disabled
#
# `0` (the default): no budget enforcement (byte-identical
# to pre-Phase-97). `>= 1`: both recall + Persona
# injection drop their lowest-ranked items until the
# running estimate fits.
#
# Estimator: hand-rolled `chars / 4` (the OpenAI rule-of-
# thumb for English) with a small fudge. Accuracy ~±20%;
# sub-token accuracy isn't worth a new tokenizer
# dependency. Unicode `chars()`-counted, not bytes.
#
# What's preserved with the budget on:
# - The protected Persona core (behavioral constraints +
#   identity scalars) is ALWAYS present regardless of
#   budget; the budget only trims soft-facet selection.
# - Edge case: if every recall hit falls out of the
#   budget, auto-recall returns no block (the planner
#   falls back to the base prompt — no empty recall
#   section).
# - The recall breadcrumb + Phase 78 learning surface +
#   Phase 84 cluster stat + Phase 77 recall_log all see
#   the post-budget set so observers match what's
#   actually injected.
#
# ----------------------------------------------------------------
# Hybrid keyword+semantic recall (Phase 98) — recall_hybrid
# ----------------------------------------------------------------
#
# Auto-recall ranks by cosine similarity over embeddings.
# Embeddings encode semantic relationships well but miss
# rare-term recall — acronyms ("ATC-417"), proper nouns
# ("Jane Henderson"), code identifiers
# (`HashMap::insert`), project codenames. The keyword
# search tool (Phase 74, `Memory::search`) handles these
# exact-match cases via substring matching but operates
# as a separate manual path.
#
# Phase 98 fuses the two via Reciprocal Rank Fusion
# (RRF): the auto-recall hook runs the semantic ranker
# AND the substring search on every recall, then
# combines their rankings via
# `score = Σ 1 / (k + rank + 1)` with `k = 60` (the
# industry-standard constant).
#
# Opt-in, off by default:
#
#   [embedding]
#   # ... rag_top_k / rag_min_similarity / ... ...
#   recall_hybrid = true   # default false
#
# Why RRF over score fusion: cosine scores in [-1, 1]
# and substring hit counts don't share a scale. RRF is
# RANK-based — it ignores raw scores and just counts
# each item's position contribution. No normalization,
# no tuning, no new dependency.
#
# Note on `rag_min_similarity`: RRF scores aren't on
# the cosine scale, so the configured similarity floor
# is skipped in the hybrid path. The `rag_top_k` cap
# still limits the fused output; items that only one
# ranker surfaces get small RRF scores that tend to be
# pushed out by stronger items. A `rag_hybrid_min_rrf`
# knob defers to a future phase.
#
# What this fixes: queries like "what's the status of
# ATC-417" or "did Jane mention anything about the
# refactor" now reliably surface memories about those
# rare terms, even when the semantic side doesn't
# strongly link them to a learnable concept.
#
# ----------------------------------------------------------------
# Graph-augmented recall (Chapter Loom) — only with recall_hybrid
# ----------------------------------------------------------------
#
# Chapter Loom deepens the hybrid path into a THREE-source
# fusion, all on one RRF ranking. It is byte-identical to the
# Phase 98 hybrid above until you turn the new pieces on.
#
#   1. The keyword ranker is now a real BM25 scorer (rare query
#      terms dominate, not just substring presence) — automatic.
#   2. `recall_lexical_weight` (default 1.0) biases that lexical
#      ranker up or down relative to the semantic one.
#   3. `recall_graph_hops` (default 0 = OFF) adds a THIRD ranker:
#      a multi-hop walk over the agent's co-occurrence graph
#      (the "these topics get recalled together helpfully"
#      signal). Set 1–2 to pull in associatively-related topics
#      the literal query missed; `recall_graph_decay` (0.5)
#      weakens each hop and `recall_graph_weight` (1.0) sets the
#      ranker's pull.
#
#   [embedding]
#   recall_hybrid        = true   # required for the below
#   recall_lexical_weight = 1.0
#   recall_graph_hops    = 1      # 0 = off (default)
#   recall_graph_decay   = 0.5
#   recall_graph_weight  = 1.0
#
# The daemon prints `aivyx-pa recall-graph: injected N via
# graph-walk` when the graph source actually steered a turn.
#
# ----------------------------------------------------------------
# Knowledge-wiki layer (Chapter Codex) — [wiki] + recall_wiki_weight
# ----------------------------------------------------------------
#
# The agent can consolidate each memory TOPIC into a derived
# "wiki page": an LLM-written summary of that topic's entries
# plus co-occurrence backlinks, browsable in the Studio "Wiki"
# screen. Pages are always derived — memory stays the source of
# truth — and the whole layer is OFF by default (auto-
# summarizing memory with the LLM has a cost you opt into).
#
# Arm generation with a [wiki] section:
#
#   [wiki]
#   enabled = true              # default false (no synthesis)
#   max_pages_per_sweep = 20    # cap LLM calls per sweep
#   interval_secs = 3600        # how often to refresh stale pages
#
# A page only regenerates when its topic's entries changed
# (incremental), so steady-state sweeps are cheap. Reads (the
# Studio Wiki screen) work regardless — they just show an empty
# codex until pages exist.
#
# Optionally let a page summary compete in RECALL as a single
# high-signal unit (one consolidated paragraph can out-cover a
# topic's scattered fragments per token):
#
#   [embedding]
#   recall_hybrid     = true
#   recall_wiki_weight = 1.0    # 0 = off (default)
#
# ----------------------------------------------------------------
# Typed knowledge graph (Chapter Lattice) — [graph] + recall_graph_typed_weight
# ----------------------------------------------------------------
#
# The agent can extract a real DIRECTED, TYPED graph from its
# memory: nodes are entities, edges are directed
# (subject)-[predicate]->(object) relations ("deploy depends-on
# ci"). It answers relational questions a topic graph can't —
# "what depends on X?", "what did Y cause?" — via the graph.query
# tool, is browsable in the Studio "Graph" screen, and can steer
# recall along meaningful relations. OFF by default (LLM
# extraction has a cost you opt into).
#
# Arm extraction with a [graph] section:
#
#   [graph]
#   enabled = true                # default false (no extraction)
#   max_topics_per_sweep = 20     # cap LLM calls per sweep
#   interval_secs = 3600          # how often to re-extract stale topics
#
# Like [wiki], extraction is incremental (only changed topics are
# re-extracted) and the graph.query tool / Studio view work
# regardless (empty until a sweep runs). Optionally let typed
# relations steer recall:
#
#   [embedding]
#   recall_hybrid           = true
#   recall_graph_typed_weight = 1.0   # 0 = off (default)
#
# Relations are folded into a controlled vocabulary (Chapter Lexicon):
# synonyms collapse to one canonical type ("depends on"/"requires" ->
# depends-on) and inverse phrasings flip ("X owned-by Y" -> "Y owns X").
# Extend or override that vocabulary for your domain — each line is
# `canonical = ["synonym", ...]`; your phrases win over the built-ins:
#
#   [graph.vocabulary]
#   depends-on = ["builds on", "sits atop"]
#   rivals     = ["competes with"]   # a brand-new relation type
#
# ----------------------------------------------------------------
# Recall feedback loop (Phase 77) — no config; learns on its own
# ----------------------------------------------------------------
#
# Once auto-recall is on AND you have a [[reflection_schedule]],
# the loop closes itself: each recall is logged, and on the
# reflection cron the assistant correlates which recalled
# memories preceded turns that went well (completed, no
# immediate operator re-ask) vs badly (failed, or you came
# right back). It uses ONLY that structural signal — it never
# asks an LLM to grade its own recall. Consistently-helpful
# memories are kept warm so they survive eviction; consistently-
# unhelpful ones are left to age out. A strongly-helpful topic
# also files a *Pending* Persona proposal you review and
# approve/reject — the loop never edits the Persona itself.
#
# There is no `[recall_feedback]` block: thresholds and the
# ~30-day recall-event retention are fixed for v1 (a tuning
# knob is a deferred follow-up). Nothing to configure — it is
# entirely a function of auto-recall + a reflection schedule
# being present. Daemon log lines `aivyx-pa recall-feedback: …`
# show each cycle's effect.
#
# To SEE what it has learned and why (Phase 78): run
# `aivyx-pa learning [--window <secs>]` or open the Web UI
# "Learning" tab — a read-only digest + per-proposal
# provenance. Also nothing to configure.

# ----------------------------------------------------------------
# LLM-judged recall usefulness (Phase 91) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# For 90 phases the recall-feedback signal above has been
# STRUCTURAL: every recall in a successful turn inherits +1,
# every recall in a failed turn inherits -1. Phase 91 adds an
# opt-in LLM-judged per-recall classification alongside the
# structural proxy — a 3-way verdict (used / irrelevant /
# hurt) recorded on each recall hit, finer than turn-level.
#
# AUGMENT, NOT REPLACE (Q3a). The new field is captured but
# no existing accumulator (Phase 82 helpfulness ledger,
# Phase 83 co-occurrence ledger, Phase 85/88 decay,
# Phase 87 proposals) consumes it in v1 — every behaviour
# stays byte-identical to pre-Phase-91. A future phase reads
# the new signal once it's validated in production.
#
# Off by default; ENABLE adds one LLM call per reflection
# cron tick (bounded cost — batched across the window's
# recalls, capped at max_recalls_per_cycle):
#
# [recall_judgment]
# enabled = true
# max_recalls_per_cycle = 30   # optional, default 30
#
# Validation (only when `enabled = true`):
# `max_recalls_per_cycle >= 1`. To turn it off: delete the
# block or set `enabled = false` — every accumulator stays
# at its pre-Phase-91 behaviour (which is also what they all
# do today even with Phase 91 ON, since v1 captures but
# doesn't yet consume the judgment).
#
# v1 simplification: the LLM judges based on the recall's
# (topic, body) content + a weak context hint — it does NOT
# see the model's actual response text (not in the audit
# chain today). A future phase enriches the input.
#
# To SEE it: daemon log `aivyx-pa recall-judgment: schedule "X"
# — judged N (used=…, irrelevant=…, hurt=…, skipped=…)` each
# cycle that fires; `aivyx-pa learning` / Web UI "Learning"
# tab show a new "LLM-judged recall usefulness (last cycle,
# opt-in)" block.

# ----------------------------------------------------------------
# Judgment-driven recall feedback (Phase 93) — OFF BY DEFAULT.
#
# Phase 91 records per-hit judgments; Phase 93 lets the
# recall-feedback actuator consume them. With this knob ON,
# `correlate_detailed` (the function that drives memory
# promotion + Persona proposal filing) uses each hit's
# RecallJudgment:
#
#   Used        → +WEIGHT  (the hit helped, regardless of
#                            turn-level outcome)
#   Hurt        → -WEIGHT  (the hit misled, regardless of
#                            turn-level outcome)
#   Irrelevant  → 0        (dead weight; neither rewards nor
#                            punishes the entry)
#   None        → falls back to the Phase 77 turn-level
#                  structural proxy (smooth migration as the
#                  Phase 91 cron processes hits incrementally)
#
# Augment, not replace: un-judged hits keep using the
# structural signal, so the loop never loses data while the
# judgment cron catches up.
#
# [recall_feedback]
# use_judgment_signal = true   # optional, default false — Phase 93
#
# To turn it off: delete the block or set the knob to false
# — `correlate_detailed` returns to byte-identical
# pre-Phase-93 behaviour.
#
# Two-knob composition: turning ON `[recall_judgment]` but
# leaving this knob OFF keeps Phase 91 in visibility-only
# mode (the v1 default posture documented at the field's
# introduction). Turning both ON closes the self-improving
# loop end-to-end. The knob lives on the consumer side
# (`[recall_feedback]`), separate from the producer side
# (`[recall_judgment]`), so the two configs remain
# independently reason-aboutable.
#
# To SEE it: `aivyx-pa learning` flags the augment with a
# `signal source: judgment-driven (Phase 93 — augmenting
# structural)` banner under the recall count when the knob
# is on.

# ----------------------------------------------------------------
# Adaptive Persona (Phase 79): with [embedding] configured,
# once the Persona is large the assistant injects only the
# facets relevant to each turn instead of the whole accreted
# Soul. Core identity + every behavioral_constraint are ALWAYS
# injected in full (never selected away). Below the size
# threshold / no [embedding] → full Persona as before,
# byte-identical. Nothing to configure; the `aivyx-pa learning`
# view and the daemon log (`aivyx-pa persona: injected N/M
# facets`) show what it selected.

# ----------------------------------------------------------------
# Proactive surfacing (Phase 80) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# Lets the assistant reach out FIRST, unprompted, on its
# existing reflection cadence when it finds a concrete reason:
# a memory about to TTL-evict, a topic whose Phase 77 net
# helpfulness is strongly positive, or a `@due:` reminder whose
# time has arrived. No LLM judges WHETHER to interrupt you — the
# gate is purely structural (the Phase 77 ethos applied to the
# highest-stakes action: an unprompted OUTBOUND message).
#
# It is off unless this [proactive] block is present AND
# `enabled = true`. With it absent/false the pass is a complete
# no-op — exactly pre-Phase-80 behaviour. It also needs a
# [[reflection_schedule]] (it piggybacks that cron) and a
# matching notify target.
#
# Safety rails: a hard `max_per_window` cap (default 3/day) on
# TOP of Phase 73's per-target rate-limit, and a never-nag
# dedup log so the same item is never surfaced twice. Every
# send lands in the notify history; the last cycle shows in
# `aivyx-pa learning` and the Web UI "Learning" tab.
#
# [proactive]
# enabled = true
# target  = "me"           # a configured notify target name
# max_per_window = 3        # optional, default 3
# window_secs    = 86400    # optional, default 86400 (1 day)
# # Each signal class defaults ON when enabled; set false to
# # mute one. At least one must stay on.
# signal_ttl_expiry     = true
# signal_recall_cluster = true
# signal_due_reminder   = true

# ----------------------------------------------------------------
# Persona lifecycle (Phase 81) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# For 80 phases the Persona ("Soul") only ever GREW. This lets
# the assistant, on its existing reflection cadence, PROPOSE
# consolidation of near-duplicate soft-list facets and decay of
# long-unreinforced ones — so the learned character stays sharp
# instead of diluting itself over months.
#
# It is off unless this [persona_lifecycle] block is present
# AND `enabled = true`. With it absent/false the pass is a
# complete no-op — exactly pre-Phase-81 behaviour. It also
# needs a [[reflection_schedule]] (it piggybacks that cron) and
# an [embedding] provider (consolidation embeds facets).
#
# Safety: it ONLY ever files Pending PersonaProposals — the
# loop never edits identity itself; you approve/reject in
# `aivyx-pa persona` / the Web UI and `aivyx-pa persona revert`
# undoes any approved action. The scalar identity and EVERY
# behavioral_constraint are structurally excluded — only the
# six soft lists are ever touched. A deterministic proposal id
# means it never re-proposes (never nags). The last cycle
# shows in `aivyx-pa learning` and the Web UI "Learning" tab.
#
# [persona_lifecycle]
# enabled = true
# consolidation_similarity = 0.92   # optional, default 0.92
# decay_max_age_secs = 7776000      # optional, default ~90d
# min_soft_facets = 6               # optional, default 6
# # Phase 85 — helpfulness-driven decay (gated by signal_decay):
# # a recall-fb-derived facet whose topic's durable (Phase 82)
# # decayed helpfulness is <= this (negative) decays BEFORE the
# # age horizon; >= its magnitude PROTECTS an age-old facet.
# # Only consulted with >= decay_min_samples ledger samples
# # (no decay/protect on thin evidence). No helpfulness ledger
# # (auto-recall off) → graceful pure age-only (= Phase 81).
# # Validated only when enabled AND signal_decay is on.
# decay_unhelpful_threshold = -2.0  # optional, default -2.0
# decay_min_samples = 3             # optional, default 3
# # Phase 88 — pattern-driven decay (gated by signal_decay):
# # a consolidate-pair: facet whose underlying Phase 83 pair
# # has decayed BELOW this floor decays before the age
# # horizon (the relationship that justified the facet is
# # gone); a pair STILL at/above the floor PROTECTS the
# # facet from age-decay (mirrors the Phase 85 helpfulness
# # protection arm). Default 1.0 mirrors Phase 87's
# # [persona_consolidation].min_affinity so the construction
# # floor and the decay floor coincide; tune it BELOW to
# # add explicit hysteresis. No co-occurrence ledger (auto-
# # recall off) → byte-identical Phase 85 fallback.
# decay_pair_below_affinity = 1.0   # optional, default 1.0
# # Each class defaults ON when enabled; set false to mute one.
# # At least one must stay on.
# signal_consolidate = true
# signal_decay = true

# ----------------------------------------------------------------
# Skills that sharpen (Chapter Whetstone) — [skill_refinement]
# ----------------------------------------------------------------
#
# Skills (the named procedures the agent follows — taught via
# `skills.teach`, seeded at onboarding, or proposed by the agent)
# are normally a static list. With this section the agent measures
# how each skill ACTUALLY performs: every turn folds its skill
# outcomes into a decayed per-skill effectiveness ledger, and on
# the reflection cadence the agent proposes a SHARPER version of an
# underperforming skill — the operator's OR its own.
#
# A refinement is a governed persona proposal (a v1→v2 supersession
# pair with provenance + lineage). It is PROPOSE-ONLY: you approve /
# edit / reject it in the Studio Agents screen (or `aivyx-pa persona`),
# and `aivyx-pa persona revert` undoes any approved one — exactly like
# every other change to the agent's identity.
#
# Off unless this block is present AND `enabled = true`. It also
# needs a [[reflection_schedule]] (it piggybacks that cron). With
# the block absent the per-skill ledger isn't even written —
# byte-identical to before.
#
# [skill_refinement]
# enabled = true
# floor = 0.0          # optional — refine when decayed effectiveness
#                      #   drops below this (0.0 = net-negative)
# min_samples = 4      # optional — confidence gate: this many folded
#                      #   windows before a skill can be refined
# max_per_cycle = 2    # optional — cap refinement proposals per cycle

# ----------------------------------------------------------------
# Skills authored from knowledge (Chapter Praxis) — [skill_authoring]
# ----------------------------------------------------------------
#
# Whetstone (above) SHARPENS skills that underperform; Praxis CREATES
# new ones. When a topic has rich, connected knowledge — a substantial
# wiki page (Chapter Codex) AND a typed-graph neighbourhood (Chapter
# Lattice) — but no skill yet, the agent synthesizes a SPECIALIZED
# skill from that page + those relations and proposes it (tagged with
# the topic as its `domain`). "The wiki is what the agent knows; the
# skill is how it acts."
#
# Like every other identity change it is PROPOSE-ONLY: you approve /
# edit / reject it in the Studio Agents screen, reversible via
# `aivyx-pa persona revert`. It needs a [[reflection_schedule]] (it
# piggybacks that cron) AND the wiki + graph layers populated (the
# simplest way: `[memory] profile = "smart"`). Off unless this block
# is present AND `enabled = true`.
#
# [skill_authoring]
# enabled = true
# min_summary_chars = 200  # optional — wiki-summary length floor for a
#                          #   topic to be "skill-worthy"
# min_edges = 2            # optional — minimum typed-graph relations
#                          #   around the topic
# max_per_cycle = 1        # optional — cap authored skills per cycle

# ----------------------------------------------------------------
# Default skill library overlays (Aivyx-Skills Part 3) — [skill_defaults]
# ----------------------------------------------------------------
#
# Distinct from Whetstone/Praxis above (which refine/author the agent's
# own learned, persona-chain skills) and from `skills.*` (that same
# learned-skill surface). This is the shared, system-level `SKILL.md`
# library from the `aivyx-skills` crate: 5 bundled defaults (e.g.
# systematic-debugging, writing-plans) always available read-only via
# the `skill_defaults.list` / `skill_defaults.read` tools and rendered
# into a `## Default skills` system-prompt section. No config is needed
# for the bundled 5; this section only adds your OWN overlay
# directories on top of them (project overrides user overrides bundled,
# per same-named skill):
#
# [skill_defaults]
# project_dir = "/path/to/repo/.aivyx/skills"   # optional
# user_dir = "/home/you/.config/aivyx-pa/skills" # optional
#
# Each directory must DIRECTLY contain one <skill-name>/SKILL.md
# subdirectory per skill (e.g. `project_dir/my-skill/SKILL.md`) — the
# same shape the bundled library itself uses. Do not point either knob
# at a project root or any other directory that doesn't directly
# contain skill subdirectories in that exact shape: a wrong shape
# silently yields ZERO overlays, not an error, so double-check the
# directory layout if an overlay skill doesn't show up in
# `skill_defaults.list`. A directory that doesn't exist is likewise
# just "no overrides from this source," not an error. Both fields are
# optional and independent; either or both may be set.

# ----------------------------------------------------------------
# Model routing (Part 3a) — [routing]
# ----------------------------------------------------------------
#
# OFF BY DEFAULT. Without a [routing] table — or with
# `enabled = false` — nothing changes: the [agent] provider + model
# serve every call exactly as before (the daemon holds the very same
# provider object). With `enabled = true`, a router picks a model per
# call from a candidate list, using the shared `aivyx-route` crate
# (the same [routing] shape aivyx-coder reads).
#
# [routing]
# enabled = true
# discover = true        # default true — ask each endpoint what it serves
#                        # at startup; false = use the roster below only
#
# # Extra LOCAL endpoints. Kinds: "ollama" (default base_url
# # http://localhost:11434), "llama_router" (llama-server router mode,
# # default http://localhost:8080), "openai_compat" (anything serving
# # /v1/models — base_url required; it may end in /v1 or not). For
# # "ollama" and "llama_router" give the bare server root (no /v1):
# # discovery calls /api/tags and /models under it, and a /v1 root
# # makes the endpoint look unreachable.
# [routing.endpoints.gpu-box]
# kind = "ollama"
# base_url = "http://192.168.1.20:11434"
#
# # The roster: declare what discovery can't tell (or override it).
# # `endpoint` omitted = the `default` endpoint (see below).
# [[routing.models]]
# id = "qwen3:8b"                        # your [agent] model
# tier = "medium"                        # small | medium | large
# strengths = ["chat"]                   # code | reasoning | chat | summarize
# capabilities = ["completion", "tools"] # completion | tools | vision |
#                                        # thinking | audio | embedding
# context_window = 32768                 # the window you actually serve
#
# [[routing.models]]
# id = "qwen3-coder:30b"
# endpoint = "gpu-box"
# tier = "large"
# strengths = ["code", "reasoning"]
# priority = 10                          # tie-break; higher wins (default 0)
# capabilities_deny = ["vision"]         # remove a discovered capability
#
# # Per-task soft preferences (defaults: chat = medium/chat,
# # plan = large/reasoning, judge = medium/reasoning).
# [routing.tasks]
# judge = { tier = "small" }
#
# The `default` endpoint. It IS your [agent] provider + model and is
# reserved: a [routing.endpoints.default] table is rejected at startup.
# It is never auto-discovered; your [agent] model is always an
# implicit candidate on it (a [[routing.models]] entry with that id and
# no endpoint, or `endpoint = "default"`, describes it instead of adding
# a second one). Other roster entries without `endpoint` are models on
# that same provider.
#
# No new cloud destinations in this release:
#   * [routing.endpoints.*] with kind = "anthropic" or "openai" is
#     rejected at startup ("cloud endpoints arrive with consent-gated
#     escalation in a later release").
#   * Cloud candidates are allowed only on the `default` endpoint, and
#     only when the [agent] provider is itself cloud — e.g. on
#     provider = "anthropic", routing may pick another Anthropic model
#     you list in [[routing.models]]; on a local provider, a cloud-
#     tagged entry is never chosen. (provider = "openai" with a loopback
#     base_url counts as local.)
#   * No API key is ever sent to a routing endpoint.
#   * Routed Ollama / OpenAI-compatible endpoints use the provider's
#     DEFAULT settings — your [ollama] tuning (e.g. num_ctx) applies
#     only to the `default` endpoint.
#   * "Local" means the endpoint KIND: an "openai_compat" base_url
#     that points at a remote host is your own choice and is treated
#     as local.
#   * Don't point a routing endpoint at the llama-server that
#     aivyx-broker fronts — routed requests go straight to it and
#     bypass the broker's slot coordination.
#
# DECLARE YOUR [agent] MODEL'S capabilities AND context_window. The
# router ranks a model whose capabilities are unknown below every model
# known to have them, so an undeclared default model loses every
# tool-using call to any discovered tool-capable model. Startup (and
# `aivyx-pa routing status`) warns when this happens.
#
# Context windows on routed Ollama endpoints: aivyx-pa sends num_ctx
# on every request, which overrides the server's own default (a
# Modelfile or OLLAMA_CONTEXT_LENGTH has no effect here). A routed
# Ollama endpoint is served with num_ctx = min(the model's trained
# window, 16384), and the router assumes that window for its models.
# Declaring `context_window` for that (endpoint, id) in the roster can
# only lower it — values above 16384 are clamped. When discovery can't
# read a model's window, the model is served at Ollama's own default
# context (often 4096) — declare that window in the roster.
# `[ollama] num_ctx` applies only to the `default` endpoint.
#
# Also note: a misspelled key directly under [routing] (e.g.
# `enable = true`) is silently ignored, so routing stays off — check
# the startup line "model routing enabled (N candidate model(s),
# default `…`)".
#
# Which calls are routed (tagged with a task kind):
#   * daemon conversation turns — `chat`, sticky per conversation (a
#     conversation keeps its model), including role-switch child
#     sessions;
#   * the Chapter Verdict completion judge (loop.complete) — `judge`,
#     whenever routing is on;
#   * the persona/skill auto-proposer judge — `judge`, only when
#     `judge_model` is unset (an explicit `judge_model` is a pin and is
#     never routed);
#   * team mission planning — `plan`.
# Everything else uses the [agent] model unchanged: memory / persona /
# wiki / graph / correction side calls, the standalone Telegram /
# Slack / Discord session paths, KV warm-up, and Ensemble per-role
# models. A request carrying an image only goes to a model with (or
# possibly with) vision; the same holds for tools. A request carrying
# a PDF is not routed at all — it goes to the [agent] model (routed
# OpenAI-compatible endpoints would drop the document). If no candidate
# qualifies — or every candidate fails — the call fails with a routing
# error.
#
# Failures: a connection error, an unknown model, or HTTP 404 / 408 /
# 5xx (or a routed endpoint that can't be set up) puts that model on a
# 60 s cooldown and the call falls back to the
# next candidate. Cooled models are still tried as a last resort if
# nothing else qualifies. A fallback is temporary — the conversation
# returns to its own model after the cooldown. A failure after the
# response has started streaming is not retried. Other errors are
# returned as-is.
#
# Discovery runs once, at startup, one endpoint after another, with a
# 5 s timeout per request: an unreachable endpoint slows startup, and
# its models stay unavailable until the daemon restarts.
#
# Visibility:
#   * tools `routing.status` (the candidate list) and `routing.explain`
#     (the last decision for this conversation — or, given an explicit
#     `session`, for another one; model / task / reason only). Both are
#     read-only, Trusted-tier, registered only when routing is on, and
#     granted to the zero-config default role (backcompat floor).
#   * `aivyx-pa routing status` — offline: runs the same discovery +
#     merge as startup and prints the candidates (* marks the [agent]
#     model, `?` marks an unknown capability). No daemon, no passphrase.
#   * `aivyx-pa routing explain [--limit N]` — offline: lists the
#     newest N (default 20) routing decisions from the audit chain.
#   * Every successfully routed call writes a `ModelRouted` audit entry (model, task,
#     reason; no session id in this release). `LlmCost` is recorded per
#     model actually used, so spend is priced correctly; `aivyx-pa
#     cost` may count a turn answered by two models twice in its turn
#     total.
#
# Cost caveats (cloud [agent] provider):
#   * The judge and mission-planning side calls don't record `LlmCost`
#     (true without routing too); routing them to a larger model
#     spends more than `aivyx-pa cost` shows.
#   * The [budget] pre-call gate prices a turn at the [agent] model;
#     routing to a pricier model on the same provider can overshoot a
#     cap by at most one turn (see docs/COST_GOVERNANCE.md).

# ----------------------------------------------------------------
# Persistent helpfulness ledger (Phase 82) — no config; automatic
# ----------------------------------------------------------------
#
# For 81 phases the "did recalling this topic help" signal was
# ephemeral (recomputed each reflection window, then discarded).
# Phase 82 makes it durable: a per-topic, time-decayed (~60-day
# half-life) accumulation folded in on the SAME reflection
# cadence as the recall-feedback loop, so the assistant can show
# what has CONSISTENTLY helped, not just what helped this week.
#
# There is no `[helpfulness_ledger]` block — like the Phase 77
# recall-feedback loop, it is entirely automatic. It is built +
# folded whenever auto-recall is configured ([embedding] +
# a [[reflection_schedule]]); with auto-recall off it does not
# exist. It is a PASSIVE signal: it changes no behaviour on its
# own (recall-feedback retention + proposals are byte-identical
# — the ledger is folded in AFTER those actuators). It
# self-prunes (decayed-to-zero + ~90d untouched → dropped), so
# nothing grows forever. Half-life / prune bounds are fixed
# code constants (tuning deferred, like the recall-log's 30-day
# retention).
#
# To SEE it: `aivyx-pa learning` or the Web UI "Learning" tab now
# shows an "Accumulated helpfulness (all-time, decayed)" block
# (signed score + sample count) alongside the windowed view.
# Daemon log: `aivyx-pa helpfulness-ledger: folded N, pruned M`.
# Nothing to configure.

# ----------------------------------------------------------------
# Cross-session pattern learning (Phase 83) — no config; automatic
# ----------------------------------------------------------------
#
# Phase 77 learns WHICH topics help; Phase 82 made that durable.
# Phase 83 learns the relationships BETWEEN topics: which two
# get recalled TOGETHER in turns that go well. Over many
# sessions a stable "these consistently help together" picture
# emerges (e.g. deploy-runbook + rollback-steps).
#
# Like Phase 77/82 there is NO config block — it is built +
# folded automatically whenever auto-recall is configured
# ([embedding] + a [[reflection_schedule]]); with auto-recall
# off it does not exist. It is a PASSIVE signal: folded in
# AFTER the recall-feedback actuators and the Phase 82 ledger,
# so both stay byte-identical (acting on the patterns is a
# future phase). Per turn the top-8 highest-scoring distinct
# topics are paired and accumulated with the same ~60-day
# half-life as the Phase 82 ledger; the top-8 cap bounds the
# combinatorics and it self-prunes (decayed + ~90d untouched).
#
# To SEE it: `aivyx-pa learning` / the Web UI "Learning" tab show
# a "Topics that consistently help together" block (signed
# score + sample count). Daemon log: `aivyx-pa cooccurrence:
# folded N, pruned M`. Nothing to configure.

# ----------------------------------------------------------------
# Cluster-aware co-recall (Phase 84) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# The first phase that ACTS on the durable learning substrate.
# When a topic is auto-recalled (Phase 76), its durable
# affined siblings from the Phase 83 co-occurrence ledger —
# topics that consistently helped alongside it across sessions
# — are ALSO surfaced, even when the literal query missed
# them. Recall becomes associative.
#
# It is off unless this [recall_cluster] block is present AND
# `enabled = true`; with it absent/false recall is
# byte-identical to pre-Phase-84. It also needs auto-recall
# configured ([embedding] + a populated co-occurrence ledger).
#
# Safety rails: siblings SHARE the existing rag_top_k budget
# (they displace the weakest primary hits — zero context/token
# growth); a hard max_siblings cap + min_affinity floor keep
# weak affinities out; and cluster-injected hits are EXCLUDED
# from the co-occurrence fold (the ledger never learns from
# its own expansion) while still measured by the Phase 77/82
# helpfulness signal (a bad expansion self-penalises).
#
# [recall_cluster]
# enabled = true
# max_siblings = 3   # optional, default 3  — hard per-turn cap
# min_affinity = 1.0 # optional, default 1.0 — decayed floor
#
# To SEE it: daemon log `aivyx-pa recall-cluster: injected N
# affined sibling(s)`; `aivyx-pa learning` / Web UI "Learning"
# tab show a "Cluster co-recall (last turn)" block (count +
# driver→sibling pairs).

# ----------------------------------------------------------------
# Pattern-driven Persona proposals (Phase 87) — OFF BY DEFAULT
# ----------------------------------------------------------------
#
# The second consumption of the Phase 83 co-occurrence ledger,
# symmetric with the recall-side Phase 84. When a pair of
# topics has consistently co-occurred AND both topics are
# independently helpful (Phase 82 ledger), the reflection
# cron asks the LLM to phrase a one-sentence `learned_context`
# facet and files it as a Pending Persona proposal — same
# Phase 70 propose-only + edit-then-approve + Revert flow.
#
# It is off unless this [persona_consolidation] block is
# present AND `enabled = true`; with it absent/false the
# Persona proposal pipeline is byte-identical to pre-Phase-87.
# It also needs auto-recall configured ([embedding] + a
# populated co-occurrence ledger + a populated helpfulness
# ledger + a [[reflection_schedule]]).
#
# Safety rails: a conservative DOUBLE-GATE — pair affinity +
# samples AND both endpoints independently helpful (a pattern
# of consistently-hurting topics is never proposed); per-cycle
# filings hard-capped (default 3); cross-cycle dedup is
# absolute (a pair already in the chain in ANY status is never
# re-filed); the LLM phrases the prose but the operator is
# still the final filter (edit-then-approve / reject via the
# Web UI Proposals pane or `aivyx-pa persona proposals`).
#
# [persona_consolidation]
# enabled = true
# min_affinity = 1.0           # optional, default 1.0
# min_samples = 3              # optional, default 3
# min_topic_helpfulness = 0.0  # optional, default 0.0
# max_proposals_per_cycle = 3  # optional, default 3
# enable_supersession = true   # optional, default false — Phase 92
#
# Phase 92: when `enable_supersession = true`, the
# consolidation pass also detects SUPERSESSION: an existing
# applied `consolidate-pair:{A}+{B}` facet whose pair has
# decayed (per the Phase 88 `[persona_lifecycle].decay_pair_
# below_affinity` floor) PLUS a new candidate pair `(A, C)`
# sharing one endpoint that strengthens past the Phase 87
# construction floor (both endpoints helpful) → file two
# LINKED proposals (a `RemoveList` for the old facet + an
# `AppendList` for the new one), each carrying a
# `supersedes_proposal_id` cross-link so the operator-
# facing surface presents them as a single supersession
# decision. Each half is still independently `Revert`-able.
# With `enable_supersession = false` (the default) the
# Phase 87 / Phase 88 proposal flow is byte-identical to
# pre-Phase-92.
#
# To SEE it: daemon log `aivyx-pa persona-consolidation: schedule
# "X" — filed N` each cycle that fires (with
# `(LLM unavailable)` appended when the LLM is unreachable;
# `(superseded=K)` appended when supersession fires);
# `aivyx-pa learning` / Web UI "Learning" tab show a
# "Pattern-driven Persona proposals (last cycle, opt-in)"
# block (with a "superseded N" suffix on the count line
# when supersession fires); the proposals themselves
# appear in `aivyx-pa persona proposals` like every other
# Phase 70 / Phase 81 / Phase 85 proposal.
#
# Phase 94 adds **grouped rendering** for the linked
# supersession pair: `aivyx-pa persona proposals` renders the
# two halves with `└─ supersedes:` / `└─ superseded by:`
# indicators, and the Web UI Proposals pane renders them as
# one card with a primary "Approve both" action plus a
# `⋮ Split` menu for partial actions (Phase 92 guarantees
# each half stays independently Revert-able). The grouping
# is pure client-side rendering — no new config keys are
# needed.

# ----------------------------------------------------------------
# Discord channel (Phase 107)
# ----------------------------------------------------------------
#
# `aivyx-pa --channel discord` runs the bot account configured below
# against Discord's Gateway. SemiTrusted tier (same ceiling as
# Telegram); DMs and any guild text channels you've added the bot
# to get distinct memory partitions keyed on Discord's channel_id
# snowflake.
#
# Setup walkthrough lives in docs/INSTALL.md "Running Aivyx PA on
# Discord" — Discord Developer Portal account → bot account → save
# token → enable MESSAGE CONTENT INTENT → invite to server or DM
# from the portal account.
#
# Uncomment + fill `token` to enable:
#
# [discord]
# token = "your_bot_token_here"
# # application_id is reserved for slash-command registration
# # (Phase 107 Q3a kept slash commands out of scope; the field is
# # plumbed so a later phase can register without re-shaping the
# # config).
# # application_id = 1234567890

# ----------------------------------------------------------------
# Slack channel (Phase 108)
# ----------------------------------------------------------------
#
# `aivyx-pa --channel slack` runs the bot account configured below
# against Slack's Socket Mode WebSocket. SemiTrusted tier (same
# ceiling as Telegram and Discord); each (team_id, channel_id)
# pair gets a distinct memory partition keyed on the Q3a
# stringification — so a Slack bot installed in two workspaces
# partitions cleanly even when channel ids collide.
#
# Setup walkthrough lives in docs/INSTALL.md "Running Aivyx PA on
# Slack" — Slack app creation → Socket Mode enablement → bot
# scopes → install to workspace → save xoxb-* + xapp-* tokens.
#
# Current state: Phase 108 ships the in-process channel layer.
# The live SlackMorphismTransport wiring is a Phase-108-internal
# deferral bundled with the Phase 107 Discord daemon-frontend
# follow-on; an operator who runs --channel slack today gets a
# "production transport not yet wired" error when the adapter
# tries to open Socket Mode. Live-bot smoke testing waits for
# the Channel Activation Milestone.
#
# Uncomment + fill the tokens to enable:
#
# [slack]
# bot_token = "xoxb-..."
# app_token = "xapp-..."
# # team_id is optional. When set, the bot only handles events
# # from this one workspace; when None, any workspace the bot
# # is installed in is accepted.
# # team_id = "T0123456789"

# ----------------------------------------------------------------
# Git read tools (Phase 109 — Amendment A12)
# ----------------------------------------------------------------
#
# `git.status` and `git.diff` are substrate read-only inspection
# tools sharing a single `git.read` capability scope qualified by
# repo path. Both tools refuse to run against any path not in the
# `repos` allow-list below; each entry is canonicalized at startup
# and must be a directory containing a `.git/` entry.
#
# The two tools shell out to the system `git` binary (no Rust deps).
# A future destructive git tool (`git.commit`, `git.checkout`) would
# warrant a separate `git.write` scope; A12 ships read-only only.
#
# Uncomment + add paths to enable:
#
# [git]
# repos = [
#     "/home/me/projects/aivyx",
#     "/home/me/projects/some-other-repo",
# ]

# ----------------------------------------------------------------
# OS-level process confinement — [confine]
# ----------------------------------------------------------------
#
# `shell.exec` and `git.rs`'s three tools (`git.status`/`git.diff`/
# `git.commit`) confine every spawned command with Landlock +
# seccomp-bpf (`aivyx-confine`), unconditionally and on by default —
# there is no config key that turns confinement itself off. The only
# knob is what happens if Landlock fails to establish a ruleset on a
# given machine (old kernel, Landlock disabled at the kernel-config
# level): `true` (default) fails the spawn closed; `false` lets it run
# unconfined instead. Confinement itself is unaffected either way when
# Landlock is working normally, and this section has no effect on
# non-Linux builds (no confinement backend there at all).
#
# [confine]
# require_enforcement = true   # default; false = fail-open on setup failure

# ----------------------------------------------------------------
# Team — Chapter Roster (the Nonagon the daemon runs)
# ----------------------------------------------------------------
#
# By default the daemon runs the built-in 9-role Nonagon
# (`aivyx-pa team roster` prints it). To run a customised team —
# a different lead, tighter specialists, or a vertical pack like
# the Kitchen BOH team — point `config_path` at a `[team]`-rooted
# TOML file (the same shape `aivyx-pa team run --config <file>` loads,
# e.g. `crates/verticals/aivyx-kitchen/assets/kitchen-boh.toml`).
#
# A relative path is resolved against this `aivyx-pa.toml`'s directory.
# When unset, the daemon also looks for a conventional `team.toml`
# beside this file; if neither exists it uses the default Nonagon.
# The Studio's Teams screen writes this file (Chapter Roster);
# changes apply on the next daemon start. Scaffold a starter file
# with `aivyx-pa team init [--pack <default|path.toml>] [--out team.toml]`.
#
# [team]
# config_path = "team.toml"

# ----------------------------------------------------------------
# Skills Auto-Creation — Phase 110 (Reflection Staging)
# ----------------------------------------------------------------
#
# Skills are procedural patterns the agent drafts after complex
# turns and the operator approves through the existing persona-
# proposal surface. They live as `PersonaDeltaCategory::LearnedSkill`
# entries inside the Persona chain alongside other identity
# deltas; approved skills render into the agent's system prompt
# as a `## Learned skills` section and are callable through the
# `skills.list` + `skills.invoke` substrate tools.
#
# Roles that should propose skills need `skills.propose` in their
# capability_scopes. Roles that should only *use* approved skills
# (read them through the prompt, invoke their procedure bodies on
# demand) need `skills.list` and `skills.invoke`. The
# `CEILING_TRUSTED` ceiling includes all three by default; remote
# SemiTrusted adapters (Telegram / Discord / Slack) do not get
# skills.* unless the role explicitly grants them.
#
# To enable a role to draft + use skills, declare the scopes
# alongside the existing reflection.* + persona.propose grants:
#
# [[role]]
# name = "researcher-with-skills"
# parents = ["researcher"]
# capability_scopes = [
#     "reflection.propose",
#     "reflection.apply",
#     "persona.propose",
#     "skills.propose",     # Phase 110 — propose new skills
#     "skills.list",        # Phase 110 — enumerate approved skills
#     "skills.invoke",      # Phase 110 — read full procedure on demand
# ]
